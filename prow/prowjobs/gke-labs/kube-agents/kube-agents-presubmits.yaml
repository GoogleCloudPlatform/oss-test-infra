    # teardown, with the agent on Claude (claude-opus-5-5 on Vertex AI, the
    # model oss-test-infra#2737 set) instead of the Gemini model every eval
    # job has run since oss-test-infra#2758. It exists to measure Claude's
    # prompt caching and cost on the real eval flow rather than a synthetic
    # test: on the 2026-10-22..27 Claude nightlies a session wrote its prompt
    # to the cache about three times instead of once. Run it on a pull request
    # that carries the cache probe (gke-labs/kube-agents#4316), whose
    # `cache probe:` lines land in the run's artifacts/litellm.log.
    #
    # On demand only, and expensive: about $260 of Claude spend per run.
    #   /test pull-kube-agents-smoke-test-claude
