    # starts it but that comment: `/test all` matches only jobs that would run
    # on their own, and `/retest` re-runs only a job that failed.
    #
    # Optional, so it never blocks a merge, and it is never the gate's
    # verdict. Its record is its own: builds land under this job's name in
    # GCS, and the readers that key on the blocking job (merge-gate.yml, the
    # sticky pin, the dashboard and pool-pressure globs) match that name
