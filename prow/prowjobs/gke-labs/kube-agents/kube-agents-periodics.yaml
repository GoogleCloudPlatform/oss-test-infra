    # eval-baseline-recorder (serviceAccountName below), which cannot write
    # the cluster default gs://kube-agents-prow. Its logs land beside the
    # main nightly's under logs/ci-kube-agents-eval-nightly-today/.
    gcs_configuration:
      bucket: kube-agents-evals-nightly-logs
