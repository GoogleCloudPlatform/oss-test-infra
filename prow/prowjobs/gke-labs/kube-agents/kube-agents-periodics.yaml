periodics:
- name: ci-kube-agents-pool-pressure
  # Hourly, off the hour so the sweep does not start alongside the presubmit herd.
  cron: "23 * * * *"
  # Same cluster as pull-kube-agents-smoke-test. Boskos is ClusterIP-only, so
  # --boskos-via http only resolves from inside it.
  cluster: build-kube-agents
  max_concurrency: 1
  decorate: true
  decoration_config:
    # A 7-day sweep read 476 builds in 288s from this cluster on 2026-09-02 and
    # build volume is climbing, so the ceiling is generous and the script's own
    # --deadline-seconds stops it well before the pod is killed. A killed pod
    # reds the tab without saying anything about the queue.
    timeout: 30m
  extra_refs:
  - org: gke-labs
    repo: kube-agents
    base_ref: main
  annotations:
    testgrid-dashboards: googleoss-kube-agents
    testgrid-tab-name: pool-pressure
    # No alert email: the CI health bot reads this job's artifact every hour
    # and posts a breach as its rule 8 note and a reading older than three
    # hours as a stale note (kube-agents docs/ci-health.md).
    # Prints the named property inside the result cells. One name for the whole
    # test group, looked up per cell, so every row the check writes carries its
    # own number under this name. The run writes it through --junit below, one
    # <testcase> per row of the report; a cell with no such property renders as
    # it did before.
    testgrid-in-cell-metric: value
    description: >-
      Measures how long kube-agents CI runs wait before their test can start and
      fails when the pool runbook's thresholds trip. Leases nothing from Boskos.
  spec:
    serviceAccountName: prowjob-default-sa
    containers:
    - image: gcr.io/google.com/cloudsdktool/google-cloud-cli:588.0.0-alpine
      command:
      - /bin/sh
      - -c
      # The working directory after an extra_refs clone is the repo root.
      # Exit 1 is a threshold breach and exit 2 is "could not measure"; both red
      # the tab on purpose, because a check that goes green having read nothing
      # is worse than no check. So the exit code is captured and re-raised at the
      # end rather than being piped into another process, whose status would
      # replace it.
      #
      # --json writes only JSON, with the human-readable report nested under
      # "report". The artifact gets the JSON and the build log gets the report,
      # because the build log is what a person opens from the TestGrid cell.
      - |
        set -eu
        OUT="${ARTIFACTS:-/tmp}/pool-pressure.json"
        rc=0
        python3 scripts/pool_pressure.py \
          --boskos-via http \
          --deadline-seconds 1500 \
          --junit "${ARTIFACTS:-/tmp}/junit_pool_pressure.xml" \
          --json > "${OUT}" || rc=$?
        python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["report"])' \
          "${OUT}" || cat "${OUT}" || true
        exit "${rc}"
      resources:
        requests:
          cpu: 500m
          memory: 1Gi

- name: ci-kube-agents-pull-sweep
  # Hourly: a re-leased project's leftover pull requests stay out of grading
  # (head-commit check, kube-agents docs/ci-pool-projects.md 5.5), so the
  # interval costs tidiness only. Every ten minutes the sweep's reads were
  # ~720 of the token-minter installation's 6,350 GitHub requests an hour;
  # hourly they are ~120. :41 is away from pool-pressure (:23) and the run
  # ends well before compute-sweep (:45).
  cron: "41 * * * *"
  # Same cluster as the presubmit: Boskos is ClusterIP-only, and the sweep
  # holds each free project through it for the seconds a repository takes.
  cluster: build-kube-agents
  max_concurrency: 1
  decorate: true
  decoration_config:
    timeout: 15m
    # Logs go to a bucket kube-agents owns: this job runs under its own
    # identity, which cannot write the cluster default gs://kube-agents-prow.
    gcs_configuration:
      bucket: kube-agents-periodic-logs
  extra_refs:
  - org: gke-labs
    repo: kube-agents
    base_ref: main
  annotations:
    testgrid-dashboards: googleoss-kube-agents
    testgrid-tab-name: pull-sweep
    description: >-
      Closes the pull requests and merge requests the eval agent left open in
      free pool projects: on GitHub by signing the agent's own App through each
      project's KMS key, on GitLab with the pool's token from Secret Manager,
      whose expiry this job also watches. Runs main only, never pull-request
      code, which is why it and not the presubmit holds a write credential.
  spec:
    # Its own identity, never the presubmit's: eval-pull-sweeper is the one
    # service account with signer rights on the pool's minter keys and read on
    # the pool's GitLab tokens in kube-agents-prow, and no job that runs
    # pull-request code may run as it.
    serviceAccountName: eval-pull-sweeper
    containers:
    - image: gcr.io/google.com/cloudsdktool/google-cloud-cli:588.0.0-alpine
      command:
      - /bin/sh
      - -c
      # The working directory after an extra_refs clone is the repo root. The
      # script takes only what Boskos hands out as free and releases every
      # project it takes, so a red here is a repository it could not sweep, not
      # a project it holds; exit 1 names the projects on stderr.
      # Two passes, GitHub then GitLab (kube-agents#2394), each over the free
      # projects with its own credential and its own report (pull-sweep.json,
      # pull-sweep-gitlab.json). Both run whatever the first returns, and the
      # job fails if either did: the GitLab pass also fails from 30 days before
      # the pool's GitLab token expires, naming it, which is how the yearly
      # rotation is announced.
      - |
        set -u
        rc=0
        python3 hack/ci_sweep_agent_pulls.py --pool \
          --boskos-server http://boskos.boskos.svc.cluster.local \
          --boskos-owner "${JOB_NAME}-${BUILD_ID}" || rc=$?
        python3 hack/ci_sweep_agent_pulls.py --pool --forge gitlab \
          --boskos-server http://boskos.boskos.svc.cluster.local \
          --boskos-owner "${JOB_NAME}-${BUILD_ID}-gitlab" || rc=$?
        exit "${rc}"
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
- name: ci-kube-agents-compute-sweep
  # Hourly: the script deletes only plants older than 4 hours
  # (DEFAULT_MAX_AGE_HOURS in hack/ci_sweep_compute_plants.py), so a shorter
  # interval deletes nothing more, and hourly deletes a leftover at most one
  # hour after it becomes old enough. Minute 45 is four minutes after the
  # pull-sweep's :41 and away from pool-pressure at :23, and a run that finds
  # nothing ends before the nightlies lease their projects at :00.
  cron: "45 * * * *"
  # Same cluster as the presubmit: Boskos is ClusterIP-only, and the sweep
  # holds each free project through it while it lists and deletes.
  cluster: build-kube-agents
  max_concurrency: 1
  decorate: true
  decoration_config:
    # Below the hourly interval. The script takes the 40 pool projects one at
    # a time. A project with no plant costs three gcloud list calls (about
    # 15 s, estimated), so a clean run takes about 10 minutes. Each plant adds
    # five deletes (three addresses, a subnet, a VPC), about 2 minutes. A run
    # that this ceiling stops releases its project on SIGTERM.
    timeout: 45m
    # Logs go to a bucket kube-agents owns: this job runs under its own
    # identity, which cannot write the cluster default gs://kube-agents-prow.
    gcs_configuration:
      bucket: kube-agents-periodic-logs
  extra_refs:
  - org: gke-labs
    repo: kube-agents
    base_ref: main
  annotations:
    testgrid-dashboards: googleoss-kube-agents
    testgrid-tab-name: compute-sweep
    description: >-
      Deletes the Compute networks, subnets and addresses that killed bench
      runs left in free pool projects: only resources whose description starts
      with "kube-agents-bench plant", and only when their VPC is older than 4
      hours. Runs main only, never pull-request code, which is why it and not
      the presubmit can delete Compute resources.
  spec:
    # Its own identity, never the presubmit's: eval-compute-sweeper can list
    # and delete networks, subnets and addresses on every pool project, and no
    # job that runs pull-request code may run as it. It is not
    # eval-pull-sweeper or seeded-fleet-reconciler, so neither of those gets
    # Compute delete rights it does not need.
    serviceAccountName: eval-compute-sweeper
    containers:
    # A pinned version, not :alpine. From 589.0.0 (2026-10-13) the alpine
    # image has no python3 on PATH; 588.0.0 has /usr/local/bin/python3.
    - image: gcr.io/google.com/cloudsdktool/google-cloud-cli:588.0.0-alpine
      command:
      - /bin/sh
      - -c
      # The working directory after an extra_refs clone is the repo root. The
      # script takes only what Boskos hands out as free and releases every
      # project it takes, so a leased project is never touched. A red here is
      # a project it could not sweep fully; compute-sweep.json in the
      # artifacts names it and the resources it could not delete.
      - |
        set -eu
        python3 hack/ci_sweep_compute_plants.py --pool \
          --boskos-server http://boskos.boskos.svc.cluster.local \
          --boskos-owner "${JOB_NAME}-${BUILD_ID}"
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
- name: ci-kube-agents-fleet-reconcile-daily
  # Daily, 08:30 UTC (4:30 AM Eastern, before the 11 AM digest that reports
  # it): every mapped pool project, asked for by name and held through Boskos
  # (free -> reconciling -> free) for its one apply, the leased ones asked for
  # again until the budget is spent. This pass catches what the on-merge run
  # (post-kube-agents-fleet-reconcile) did not reach, repairs what the CI
  # health bot's scan found drifted or absent, and rolls seeded-b's
  # NO_MINOR_UPGRADES maintenance exclusion forward; nothing else renews it,
  # and a lapsed exclusion lets GKE heal the planted lag.
  cron: "30 8 * * *"
  # Same cluster as the presubmit: Boskos is ClusterIP-only.
  cluster: build-kube-agents
  max_concurrency: 1
  decorate: true
  decoration_config:
    # The run's own budget below is 5h30m: no project starts with less than
    # its 60-minute ceiling left, so the last one ends by the budget plus the
    # script's 120 s interrupt grace, and this ceiling is never what stops it.
    timeout: 6h
    # Logs go to a bucket kube-agents owns: this job runs under its own
    # identity, which cannot write the cluster default gs://kube-agents-prow.
    gcs_configuration:
      bucket: kube-agents-periodic-logs
    # Above the script's 150 s worker drain (its 120 s tofu interrupt grace
    # and a margin): entrypoint sends SIGINT, the script forwards it to every
    # running tofu, and each releases its state lock before the pod is killed.
    grace_period: 3m
  extra_refs:
  - org: gke-labs
    repo: kube-agents
    base_ref: main
  annotations:
    testgrid-dashboards: googleoss-kube-agents
    testgrid-tab-name: fleet-reconcile-daily
    # No alert email: the CI health bot reads each run's finished.json and
    # report and posts a failed or overdue one to the Chat space (kube-agents
    # docs/ci-health.md, "The watched periodics").
    description: >-
      Applies the seeded fleet stack (bench/tf/fleet at main) in every pool
      project once a day, four at a time under a Boskos lease each, refusing
      any delete or replace reconcile-allow.json does not list, and stopping
      with the rest not reached once main's fleet tree moves under it. Rolls
      seeded-b's maintenance exclusion forward. Red is a project it could not
      reconcile or a plan it refused, named in fleet-reconcile.json.
  spec:
    # Its own identity, never the presubmit's: seeded-fleet-reconciler holds
    # container.admin and project IAM admin on every pool project, and no job
    # that runs pull-request code may run as it.
    serviceAccountName: seeded-fleet-reconciler
    containers:
    - image: gcr.io/k8s-staging-test-infra/kubekins-e2e:latest-1.32
      command:
      - /bin/bash
      - -c
      # The same image and OpenTofu install as the presubmit; the stack's
      # kubernetes provider needs gke-gcloud-auth-plugin, which the image has.
      - |
        set -euo pipefail
        command -v gke-gcloud-auth-plugin >/dev/null
        curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh && chmod +x install-opentofu.sh && ./install-opentofu.sh --install-method standalone
        # clonerefs builds the checkout with `git init` and a fetch by URL, so
        # it has no remote; --stop-when-moved fetches `origin main` by name and
        # refuses to start without it.
        git remote add origin https://github.com/gke-labs/kube-agents.git
        python3 hack/fleet_reconcile.py --all --workers 4 \
          --budget-seconds 19800 --project-ceiling-seconds 3600 \
          --stop-when-moved origin/main \
          --boskos-server http://boskos.boskos.svc.cluster.local \
          --boskos-owner "${JOB_NAME}-${BUILD_ID}"
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
- name: ci-kube-agents-eval-nightly
  # The nightly catch-all (gke-labs/kube-agents#1021): runs the FULL eval
  # catalog against main -- every case the pull-kube-agents-smoke-test
  # presubmit runs, identically, plus the nightly-only cases too slow or too
  # redundant for a presubmit seat. EVAL_TIER=nightly below is what selects
  # that matrix; it is the only eval-selection difference from the presubmit,
  # whose spec this job otherwise copies verbatim: same Boskos lease from the
  # kube-agents-evals-project pool, same full cluster provisioning, deploy,
  # eval and teardown. Because Prow sets JOB_TYPE=periodic and no PULL_NUMBER
  # here, the repo script's main-branch-only paths arm themselves on this job
  # and stay off on the presubmit: `bench-gate record` emits the
  # baseline-append.jsonl artifact every night (and appends straight to the
  # evidence store once EVAL_BASELINE_STORE below is armed), which is what
  # fills the admission window the #925 gate machinery reads.
  #
  # Grades spec.mode next (EVAL_MODE_NEXT=1 below), the mode a new install
  # gets and the one pull-kube-agents-smoke-test grades, so this job, its
  # -main-b to -main-e shards and its three writers thirds record the next-mode window the
  # presubmit is compared with (gke-labs/kube-agents#2007). The rollback to
  # today is proven by pull-kube-agents-smoke-test-today
  # (kube-agents-presubmits.yaml) and the staging promotion pipeline.
  cluster: build-kube-agents
  # 00:00 UTC (8 PM EDT / 7 PM EST; 5 PM / 4 PM Pacific): after the working
  # day's presubmit herd in the team's Eastern time zone, so the nightly's
  # model-quota draw rarely contends with pull requests, and the night is
  # over before the next morning's 11 AM ET digest reports it. The herd can
  # still hold the pool at this hour (34 smoke runs did on 2026-11-11,
  # gke-labs/kube-agents#5472), so the acquire below waits up to 90m of this
  # part's own timeout for a project.
  # ci-kube-agents-pool-pressure above fires at :23 and leases nothing from
  # Boskos, so the two never contend.
  cron: "0 0 * * *"
  # A slow nightly must skip the next tick, not stack a second lease and a
  # second full provisioning behind it.
  max_concurrency: 1
  decorate: true
  decoration_config:
    # The presubmit's 360m budget, for a bigger matrix. Priced from the
    # NIGHTLY_TASKS comment in hack/ci-eval-pr.sh as of 2026-09-10: the
    # eighteen presubmit tasks are ~211min SERIAL (the twenty-task ~317min
    # of build 2094442155576659968 less the ~106min #1218 moved out), and
    # the eight nightly-only entries add ~321-341min (five recast cases
    # ~190min, the two tofu incumbents ~106min, knowledge-grounding
    # ~25-45min): twenty-six tasks, ~532-552min serial at three repetitions.
    # The presubmit's parallel runs on 2026-09-10 realised ~1.15x at
    # EVAL_TASK_PARALLELISM=4 (177-217min whole-job for the ~211min-serial
    # matrix) under the daytime herd's model-quota contention; at that rate
    # the nightly projects to ~470-490min, which 360m would truncate most
    # nights. 480m fits with margin, and this job is non-gating, so a long
    # night costs a lease and nothing else (gke-labs/kube-agents#1491). The
    # nightly also runs at EVAL_TASK_PARALLELISM=8 (exported below): it is
    # alone on the quota at this hour. Measured over the first six nights
    # (2026-09-16..21, gke-labs/kube-agents#1491): the matrix grew to 41
    # cases / 123 units and spent 1734-2693 serial minutes a night; at
    # parallelism 6 the fan-out realised 5.4-5.8x, so three of six nights ran
    # to this deadline and recorded nothing. At 8 the worst night so far fits
    # in ~6h; the budget stays 480m. Back to 6 under spec.mode next (see the
    # export below).
    # 720m -> 840m for the gemini-4-argon window (oss-test-infra#2758): the first
    # Argon night (2026-10-29) cut main-a at 720m with 252 of 255 units done,
    # ~750m needed, and main-b took 550m. A run cut at 840m ends by 14:06 UTC;
    # the ci-health digest moves to 11 AM Toronto to stay after that, and the
    # dashboard's running window to 14h30m (gke-labs/kube-agents#4238).
    # Before that, 480m -> 720m with the model change gke-labs/kube-agents#3384 sized for: the
    # whole main part on that model at parallelism 8 replays to a median
    # of 426min and a maximum of 528min over the nine nights
    # 10-08..16. Split into two halves on two leased projects (option C
    # there), the same replay puts each half at a ~219min median and a
    # ~305min maximum. Each half keeps 720m all the same: that replay is
    # today-mode at parallelism 8, and the first spec.mode next night (build
    # 2113782591592075264, the whole main part at parallelism 6, 23min of it
    # the next-mode deploy) ran to 720m with about 20 cases finished. A run
    # cut at 720m still ends by 12:00 UTC, before the 15:00 UTC digest (11 AM Toronto; gke-labs/kube-agents#4238).
    timeout: 840m
    grace_period: 5m
    # Logs and artifacts go to a bucket kube-agents owns, NOT the cluster
    # default gs://kube-agents-prow (prow/oss/config.yaml, build-kube-agents).
    # This job runs as eval-baseline-recorder (see serviceAccountName below),
    # and that identity has no write on kube-agents-prow, which the oss-prow
    # team owns: night one died in initupload with a 403 on
    # storage.objects.create before the test container ever started (build
    # 2099649477534027776). Rather than ask for a grant on a bucket that is
    # not ours, the nightly uploads to one that is. Granted on it: this job's
    # identity and crier (oss-prow@oss-prow) as objectAdmin; Deck
    # (oss-prow-public-deck@oss-prow) and the ci-health collector
    # (github-actions@kube-agents-prow) as objectViewer. Only the bucket is
    # overridden: path_strategy and Workload Identity credentials come from
    # the cluster default, which Prow merges under a job-level override field
    # by field.
    gcs_configuration:
      bucket: kube-agents-evals-nightly-logs
  annotations:
    # No TestGrid tab on purpose: the team reads this run through the eval
    # dashboard (gke-labs/kube-agents#1335) rather than a second UI, so the
    # googleoss-kube-agents dashboard keeps only the pool-pressure tab.
    testgrid-create-test-group: "false"
    description: Nightly full-catalog kube-agents eval on main under spec.mode next, recording baseline evidence (gke-labs/kube-agents#1021 and gke-labs/kube-agents#2007).
  extra_refs:
  - org: gke-labs
    repo: kube-agents
    base_ref: main
    workdir: true
  spec:
    # NOT prowjob-default-sa, which the presubmit runs as. The read/write
    # split on the evidence bucket -- this job appends, a pull request only
    # reads -- is expressible only across two identities, because one account
    # cannot both hold and be denied objectCreator (docs/designs/eval-scorer.md,
    # "Two conditions that guard depends on", in gke-labs/kube-agents). The KSA
    # test-pods/eval-baseline-recorder and its Workload Identity binding to
    # eval-baseline-recorder@kube-agents-prow.iam.gserviceaccount.com are
    # prerequisites of this file: without them this pod does not schedule.
    serviceAccountName: eval-baseline-recorder
    containers:
    - image: gcr.io/k8s-staging-test-infra/kubekins-e2e:latest-1.32
      command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # procps for pkill: cleanup() uses it to reap the heartbeat's
        # boskosctl child, and its `|| true` would swallow a missing binary.
        apt-get update && apt-get install -y --no-install-recommends gettext-base jq procps
        command -v gke-gcloud-auth-plugin >/dev/null
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh && chmod +x install-opentofu.sh && ./install-opentofu.sh --install-method standalone
        export GEMINI_API_KEY="$(cat /etc/gemini-secret/GEMINI_API_KEY)"
        # The bench verifier reads back the GitHub ledger issue the run
        # published and grades its contents; ledger_issue_contains has no
        # other credential source, and the *-infra repos are private.
        export BENCH_GITHUB_TOKEN="$(cat /etc/bench-github-token/BENCH_GITHUB_TOKEN)"
        # hack/ci-eval-pr.sh mints a 1-hour installation token per
        # devops-bench invocation and overwrites BENCH_GITHUB_TOKEN with it.
        # App 4739812 is read-only and scoped to the *-infra repos.
        # gke-labs/kube-agents#994.
        export EVAL_LEDGER_APP_KEY_FILE="/etc/ledger-app-key/key.pem"
        # Turns on the in-cluster token minter, which is what lets the agent
        # write that issue. An App ID is an identifier, not a credential:
        # minting requires signing a JWT with the App's private key, which
        # is non-exportable inside each pool project's Cloud KMS. What bounds
        # where a run can write is the App's installation list -- the
        # *-infra repos, repository_selection: selected -- not this value,
        # which gke-labs/kube-agents already publishes.
        export EVAL_GITHUB_APP_ID="4675512"
        export REQUIRE_CACHE="true"
        # The tier switch: hack/ci-eval-pr.sh appends its NIGHTLY_TASKS array
        # to the presubmit matrix on this value and refuses anything it does
        # not recognise. This export is the whole difference between this job
        # and the presubmit's eval step.
        export EVAL_TIER="nightly"
        # ─── spec.mode next ─────────────────────────────────────────────────
        # hack/ci-deploy.sh flips the install to spec.mode next after the
        # today-mode install has passed its own gates, and hack/ci-eval-pr.sh
        # runs the matrix through the gateway's inject door, less
        # hack/eval/inject-lane-exclusions.txt. The deploy admits the flag on
        # this job, which has no PULL_NUMBER, only by name
        # (EVAL_MODE_NEXT_JOB_NAMES in hack/ci-deploy.sh, which
        # gke-labs/kube-agents#3783 extends: merge that first, or this job
        # reds at the deploy's refusal). bench-gate reads the inject transport
        # as the version key's next mode, so the lines this job appends file
        # under next and never reach today's window.
        export EVAL_MODE_NEXT="1"
        # ─── The agent model: the `nightly` pair of the eval-model Secret ─────────
        # The nightlies' pair, which every nightly and weekly periodic reads;
        # the gate's record is built from these runs, so `gate.name` must name
        # the same model or rung 6 compares nothing.
        # Mounted at /etc/eval-model from kube-agents-eval-model (namespace
        # test-pods on build-kube-agents). The mechanism and its reasons are on
        # pull-kube-agents-smoke-test's block in kube-agents-presubmits.yaml;
        # this block sets no model, and a switch is one write to the Secret.
        MODEL_PROVIDER="$(tr -d '[:space:]' < /etc/eval-model/nightly.provider)"
        MODEL_DEFAULT_NAME="$(tr -d '[:space:]' < /etc/eval-model/nightly.name)"
        : "${MODEL_PROVIDER:?eval-model Secret: nightly.provider is missing or empty}"
        : "${MODEL_DEFAULT_NAME:?eval-model Secret: nightly.name is missing or empty}"
        export MODEL_PROVIDER MODEL_DEFAULT_NAME
        export AGENT_MODEL_OVERRIDE="${MODEL_DEFAULT_NAME}"
        # The main part: everything but the cases that request a pull
        # request, which ci-kube-agents-eval-nightly-writers and its -b and -c
        # thirds below run on leased projects of their own
        # (gke-labs/kube-agents#2467, #4238). Those run one
        # unit at a time after every other unit, against the project's one
        # GitOps repository, and on one project that phase and the infra
        # lock's stretch did not fit 480m together. The main part itself is
        # split in five disjoint shards (gke-labs/kube-agents#3384, option C,
        # then #4238; the split lives in hack/ci-eval-pr.sh): this job runs
        # main-a, the shard that carries the onboarding cases' chain and no
        # other stack case; ci-kube-agents-eval-nightly-main-b to -main-e run
        # main-b to main-e.
        export EVAL_NIGHTLY_PART="main-a"
        # Wider fan-out than the presubmit's 4: the nightly runs alone on the
        # model quota at this hour. 6 -> 8 on 2026-09-22 after six measured
        # nights (see the timeout comment above); 8 -> 6 with the move to
        # spec.mode next. hack/ci-deploy.sh sizes the provision's maxSessions
        # from this value: at 6 it is 2, and at 8 the bridge's reserve alone
        # exceeds the bus's task floor, so the stream is created wider than
        # the floor, a shape no run has measured. 6 is what the next-mode
        # nightly ran at: the whole catalog, this part plus the one-at-a-time
        # pull-request units (about 100m), took 403-717m a night from
        # 2026-10-08 to 10-21. The first night this job ran the whole main
        # part under next it reached the 720m deadline, which is why the part
        # is now sharded (the timeout comment above); a night cut at the
        # deadline keeps the cases it already recorded.
        export EVAL_TASK_PARALLELISM="6"
        # ─── Baseline evidence store: ARMED ──────────────────────────────────
        # The bucket, the eval-baseline-recorder identity this job runs as,
        # and the grants on both are prerequisites -- docs/designs/
        # eval-scorer.md, "Provisioning it", in gke-labs/kube-agents. The
        # contract from hack/ci-eval-pr.sh's EVAL_BASELINE_STORE comment:
        # turning the store on is TWO Prow exports, not one. This nightly
        # holds objectViewer AND objectCreator on the bucket (it appends one
        # immutable object per case per night); the presubmit exports the
        # SAME variable with objectViewer only (it reads). Forgetting the
        # presubmit half is silent -- it keeps reading the empty checked-in
        # directory and reports a legitimate green with the rate-based rungs
        # inert. baseline-append.jsonl still rides as an artifact.
        #
        # EVAL_REPETITIONS stays at the script's default 3: at that count a
        # case reaches the 20-run admission bar after seven nights, and the
        # matrix already projects past this job's 360m at three (see the
        # timeout comment above). Raise it here on measured wall clock from
        # the first nights, not on arithmetic.
        export EVAL_BASELINE_STORE="gs://kube-agents-evals-bench/evidence"
        # ─── Ensure boskosctl is available (pinned version) ─────────────────────────
        # Named once, used by both the GCS fast path and the fallback below.
        BOSKOSCTL_VERSION="v0.0.0-20260730151943-11fb0c84248b"
        if ! command -v boskosctl >/dev/null; then
          # Prefer a binary staged in a bucket we own. gke-labs/kube-agents#943
          # died here: proxy.golang.org answered INTERNAL_ERROR and the job
          # exited before it had leased a project, so no task ran at all and
          # there was nothing for a rerun to repeat. A pinned binary does not
          # need the public module proxy on the critical path of every run.
          #
          # NOTE: gs://kube-agents-prow/tools/boskosctl-* does not exist yet.
          # Until somebody stages it, this copy always misses and the fallback
          # is the real path -- which is why the fallback is retried.
          if gsutil -q cp "gs://kube-agents-prow/tools/boskosctl-${BOSKOSCTL_VERSION}" /usr/local/bin/boskosctl; then
            chmod +x /usr/local/bin/boskosctl
            echo "✓ boskosctl ${BOSKOSCTL_VERSION} restored from GCS"
          else
            echo "boskosctl ${BOSKOSCTL_VERSION} not in GCS; falling back to the module proxy"
            for attempt in 1 2 3; do
              if GOBIN=/usr/local/bin go install "sigs.k8s.io/boskos/cmd/boskosctl@${BOSKOSCTL_VERSION}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "ERROR: go install boskosctl failed 3 times; proxy.golang.org is the usual cause"
                exit 1
              fi
              echo "go install attempt ${attempt} failed; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            done
          fi
        fi

        # ─── Boskos Lease, Heartbeat & Cleanup Handler ──────────────────────────────
        BOSKOS_SERVER="http://boskos.boskos.svc.cluster.local"
        BOSKOS_RESOURCE_TYPE="kube-agents-evals-project"
        BOSKOS_OWNER="${JOB_NAME}-${BUILD_ID}"
        BOSKOSCTL=(boskosctl --server-url="${BOSKOS_SERVER}" --owner-name="${BOSKOS_OWNER}")

        echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Leasing GCP Project from Boskos ==="
        # 90m, not the presubmit's 10m: the eight nightly parts lease together at
        # 00:00 UTC against a pool the presubmit herd may have filled, and the
        # wait comes out of this part's own timeout (gke-labs/kube-agents#5472).
        RESOURCE="$("${BOSKOSCTL[@]}" acquire --type="${BOSKOS_RESOURCE_TYPE}" \
          --state=free --target-state=busy --timeout=90m)"
        LEASED_PROJECT="$(echo "${RESOURCE}" | jq -r .name)"
        if [ -z "${LEASED_PROJECT}" ] || [ "${LEASED_PROJECT}" = "null" ]; then
          echo "ERROR: could not parse leased project from: ${RESOURCE}"
          exit 1
        fi
        export PROJECT_ID="${LEASED_PROJECT}"
        echo "✓ Successfully leased project: ${PROJECT_ID}"

        # Marks "teardown has begun" for the heartbeat's abort fallback. Its
        # directory is created fresh by mktemp -d, so the sentinel provably
        # does not exist until cleanup() creates it -- a fixed path could be
        # left behind by an earlier run and would silence the abort for the
        # whole job.
        TEARDOWN_DIR="$(mktemp -d)"
        TEARDOWN_SENTINEL="${TEARDOWN_DIR}/teardown-begun"

        cleanup() {
          local rc=$?
          trap - EXIT INT TERM
          # Before the kills, and this ordering is the point. If the
          # heartbeat exhausts its retries in the window between `trap -`
          # above and the subshell actually dying, its `kill -TERM $$`
          # fallback lands with no handler installed and terminates this
          # script mid-teardown -- before ci-teardown.sh finishes and before
          # the Boskos release, leaking GKE resources into a project the next
          # lease hands straight to somebody else. The sentinel silences the
          # fallback for an expiry during intentional teardown only; a
          # heartbeat that dies mid-eval still aborts the run.
          touch "${TEARDOWN_SENTINEL}"
          # boskosctl is a child of the subshell, not the subshell itself:
          # the subshell body is a compound command, so bash does not
          # exec-optimise it away. Killing only ${HEARTBEAT_PID} orphans a
          # heartbeat that keeps beating a resource this cleanup is about to
          # release, and Boskos answers 401 Unauthorized on the owner
          # mismatch -- nine of them, matching --retries=8. That reads like a
          # credential problem next to a Boskos release and is not one.
          pkill -P "${HEARTBEAT_PID:-0}" 2>/dev/null || true
          kill "${HEARTBEAT_PID:-}" 2>/dev/null || true
          kill "${STEP_PID:-}" 2>/dev/null || true
          echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Running CI Teardown ==="
          ./hack/ci-teardown.sh || true
          if [ -n "${LEASED_PROJECT:-}" ] && [ "${LEASED_PROJECT}" != "null" ]; then
            echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Releasing Boskos Project: ${LEASED_PROJECT} ==="
            "${BOSKOSCTL[@]}" release --name="${LEASED_PROJECT}" --target-state=free || true
          fi
          exit $rc
        }
        trap cleanup EXIT INT TERM

        # The abort fallback fires only while the eval is still running. Once
        # cleanup() has touched the sentinel the resource is on its way back
        # to the pool, so an expiring heartbeat is expected and must not
        # signal a script that is mid-teardown. `$$` is still this script's
        # PID inside the subshell, which is what the comment below is about.
        #
        # --timeout outlives the job, and ANY exit of the heartbeat aborts the
        # run, exit 0 included. boskosctl stops beating at its --timeout (5h by
        # default) and exits 0; four kube-agents smoke runs held past that point
        # on 2026-10-14 lost their leases while still running, the reaper handed
        # their projects to other runs, and at the ceiling their teardowns
        # uninstalled the new tenants (gke-labs/kube-agents#3129). This job's
        # timeout is 840m, so a heartbeat that stops before then means the
        # project is about to be taken away, whatever its exit status says.
        ( "${BOSKOSCTL[@]}" heartbeat --resource "${RESOURCE}" --period=30s --retries=8 --timeout=860m || true
          [ -e "${TEARDOWN_SENTINEL}" ] || kill -TERM $$ ) &
        HEARTBEAT_PID=$!

        # Every step runs in the background and is waited on, because bash
        # defers a trapped signal until the *foreground* command completes.
        # Run in the foreground, a heartbeat failure mid-eval would sit
        # pending for the rest of the multi-hour step -- long past the 5m
        # Boskos reaper window, so a concurrent run could lease the same
        # project -- and if the step then exited 0, cleanup would capture
        # rc=0 and the job would go green having never run the eval. `wait`
        # is interruptible, so the trap fires immediately and cleanup sees
        # 143.
        #
        # Signalling the process group (kill -TERM 0) also interrupts
        # promptly, but prow's entrypoint starts the job without Setpgid
        # (sigs.k8s.io/prow pkg/entrypoint/run.go), so the group includes the
        # entrypoint itself: it would mark the job aborted and SIGKILL this
        # script once grace_period expires, cutting teardown and the Boskos
        # release short. This form does not depend on that topology.
        run_step() { "$@" & STEP_PID=$!; wait "${STEP_PID}"; }

        # Clean up any leftover state if a previous job was hard-killed
        run_step ./hack/ci-teardown.sh || true
        run_step ./hack/ci-connection-test.sh
        run_step ./hack/ci-deploy.sh
        run_step ./hack/ci-eval-pr.sh
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
      volumeMounts:
      - name: gemini-secret
        mountPath: /etc/gemini-secret
        readOnly: true
      - name: eval-model
        mountPath: /etc/eval-model
        readOnly: true
      - name: bench-github-token
        mountPath: /etc/bench-github-token
        readOnly: true
      - name: ledger-app-key
        mountPath: /etc/ledger-app-key
        readOnly: true
    volumes:
    - name: gemini-secret
      secret:
        secretName: kube-agents-gemini-api-key
    - name: eval-model
      secret:
        secretName: kube-agents-eval-model
    - name: bench-github-token
      secret:
        secretName: kube-agents-bench-github-token
    - name: ledger-app-key
      secret:
        secretName: kube-agents-evals-ledger-app-key
- name: ci-kube-agents-eval-nightly-main-b
  # The main-b shard of the nightly's main part (gke-labs/kube-agents#3384,
  # option C, then #4238). On claude-opus-5 the whole main part replayed to a
  # 426min median and a 528min maximum on one project, past the 480m budget
  # about one night in nine, so hack/ci-eval-pr.sh split it into two halves
  # on EVAL_NIGHTLY_PART=main-a / main-b (gke-labs/kube-agents#3432); on
  # gemini-4-argon main-a was cut at 840m five nights in seven while this job
  # ran 449-749m, so the split is now five shards, main-a to main-e, each
  # stack chain a quarter of this job's old one. This job runs main-b on a
  # lease of its own while ci-kube-agents-eval-nightly above runs main-a and
  # ci-kube-agents-eval-nightly-main-c, -main-d and -main-e below run the rest.
  # Otherwise this is that job's spec, copied, as
  # ci-kube-agents-eval-nightly-writers is: the same lease pool, provisioning,
  # deploy, eval, teardown, identity, cron and log bucket, so its baseline
  # records and its logs land where the other parts' do (the dashboard joins
  # the builds into one night). All five shards append to the evidence store;
  # their cases are disjoint, so no case is recorded twice a night. The
  # Boskos owner, log path and build identity all derive from JOB_NAME and
  # BUILD_ID, so nothing below needs to differ by hand. Like the other
  # parts it grades spec.mode next (EVAL_MODE_NEXT=1 below).
  #
  # What the copied comments below say about the whole job:
  # The nightly catch-all (gke-labs/kube-agents#1021): runs the FULL eval
  # catalog against main -- every case the pull-kube-agents-smoke-test
  # presubmit runs, identically, plus the nightly-only cases too slow or too
  # redundant for a presubmit seat. EVAL_TIER=nightly below is what selects
  # that matrix; it is the only eval-selection difference from the presubmit,
  # whose spec this job otherwise copies verbatim: same Boskos lease from the
  # kube-agents-evals-project pool, same full cluster provisioning, deploy,
  # eval and teardown. Because Prow sets JOB_TYPE=periodic and no PULL_NUMBER
  # here, the repo script's main-branch-only paths arm themselves on this job
  # and stay off on the presubmit: `bench-gate record` emits the
  # baseline-append.jsonl artifact every night (and appends straight to the
  # evidence store once EVAL_BASELINE_STORE below is armed), which is what
  # fills the admission window the #925 gate machinery reads.
  cluster: build-kube-agents
  # 00:00 UTC (8 PM EDT / 7 PM EST; 5 PM / 4 PM Pacific): after the working
  # day's presubmit herd in the team's Eastern time zone, so the nightly's
  # model-quota draw rarely contends with pull requests, and the night is
  # over before the next morning's 11 AM ET digest reports it. The herd can
  # still hold the pool at this hour (34 smoke runs did on 2026-11-11,
  # gke-labs/kube-agents#5472), so the acquire below waits up to 90m of this
  # part's own timeout for a project.
  # ci-kube-agents-pool-pressure above fires at :23 and leases nothing from
  # Boskos, so the two never contend.
  cron: "0 0 * * *"
  # A slow nightly must skip the next tick, not stack a second lease and a
  # second full provisioning behind it.
  max_concurrency: 1
  decorate: true
  decoration_config:
    # The presubmit's 360m budget, for a bigger matrix. Priced from the
    # NIGHTLY_TASKS comment in hack/ci-eval-pr.sh as of 2026-09-10: the
    # eighteen presubmit tasks are ~211min SERIAL (the twenty-task ~317min
    # of build 2094442155576659968 less the ~106min #1218 moved out), and
    # the eight nightly-only entries add ~321-341min (five recast cases
    # ~190min, the two tofu incumbents ~106min, knowledge-grounding
    # ~25-45min): twenty-six tasks, ~532-552min serial at three repetitions.
    # The presubmit's parallel runs on 2026-09-10 realised ~1.15x at
    # EVAL_TASK_PARALLELISM=4 (177-217min whole-job for the ~211min-serial
    # matrix) under the daytime herd's model-quota contention; at that rate
    # the nightly projects to ~470-490min, which 360m would truncate most
    # nights. 480m fits with margin, and this job is non-gating, so a long
    # night costs a lease and nothing else (gke-labs/kube-agents#1491). The
    # nightly also runs at EVAL_TASK_PARALLELISM=8 (exported below): it is
    # alone on the quota at this hour. Measured over the first six nights
    # (2026-09-16..21, gke-labs/kube-agents#1491): the matrix grew to 41
    # cases / 123 units and spent 1734-2693 serial minutes a night; at
    # parallelism 6 the fan-out realised 5.4-5.8x, so three of six nights ran
    # to this deadline and recorded nothing. At 8 the worst night so far fits
    # in ~6h; the budget stays 480m. Back to 6 under spec.mode next (see the
    # export below).
    # 720m -> 840m for the gemini-4-argon window (oss-test-infra#2758): the first
    # Argon night (2026-10-29) cut main-a at 720m with 252 of 255 units done,
    # ~750m needed, and main-b took 550m. A run cut at 840m ends by 14:06 UTC;
    # the ci-health digest moves to 11 AM Toronto to stay after that, and the
    # dashboard's running window to 14h30m (gke-labs/kube-agents#4238).
    # Before that, 480m -> 720m with the model change gke-labs/kube-agents#3384 sized for: the
    # whole main part on that model at parallelism 8 replays to a median
    # of 426min and a maximum of 528min over the nine nights
    # 10-08..16. Split into two halves on two leased projects (option C
    # there), the same replay puts each half at a ~219min median and a
    # ~305min maximum. Each half keeps 720m all the same: that replay is
    # today-mode at parallelism 8, and the first spec.mode next night (build
    # 2113782591592075264, the whole main part at parallelism 6, 23min of it
    # the next-mode deploy) ran to 720m with about 20 cases finished. A run
    # cut at 720m still ends by 12:00 UTC, before the 15:00 UTC digest (11 AM Toronto; gke-labs/kube-agents#4238).
    timeout: 840m
    grace_period: 5m
    # Logs and artifacts go to a bucket kube-agents owns, NOT the cluster
    # default gs://kube-agents-prow (prow/oss/config.yaml, build-kube-agents).
    # This job runs as eval-baseline-recorder (see serviceAccountName below),
    # and that identity has no write on kube-agents-prow, which the oss-prow
    # team owns: night one died in initupload with a 403 on
    # storage.objects.create before the test container ever started (build
    # 2099649477534027776). Rather than ask for a grant on a bucket that is
    # not ours, the nightly uploads to one that is. Granted on it: this job's
    # identity and crier (oss-prow@oss-prow) as objectAdmin; Deck
    # (oss-prow-public-deck@oss-prow) and the ci-health collector
    # (github-actions@kube-agents-prow) as objectViewer. Only the bucket is
    # overridden: path_strategy and Workload Identity credentials come from
    # the cluster default, which Prow merges under a job-level override field
    # by field.
    gcs_configuration:
      bucket: kube-agents-evals-nightly-logs
  annotations:
    # No TestGrid tab on purpose: the team reads this run through the eval
    # dashboard (gke-labs/kube-agents#1335) rather than a second UI, so the
    # googleoss-kube-agents dashboard keeps only the pool-pressure tab.
    testgrid-create-test-group: "false"
    description: Nightly kube-agents eval on main under spec.mode next, the main-b shard of the main part (the stack-bearing cases hack/eval/nightly-main-b.txt lists), on its own project (gke-labs/kube-agents#3384 and gke-labs/kube-agents#4238).
  extra_refs:
  - org: gke-labs
    repo: kube-agents
    base_ref: main
    workdir: true
  spec:
    # NOT prowjob-default-sa, which the presubmit runs as. The read/write
    # split on the evidence bucket -- this job appends, a pull request only
    # reads -- is expressible only across two identities, because one account
    # cannot both hold and be denied objectCreator (docs/designs/eval-scorer.md,
    # "Two conditions that guard depends on", in gke-labs/kube-agents). The KSA
    # test-pods/eval-baseline-recorder and its Workload Identity binding to
    # eval-baseline-recorder@kube-agents-prow.iam.gserviceaccount.com are
    # prerequisites of this file: without them this pod does not schedule.
    serviceAccountName: eval-baseline-recorder
    containers:
    - image: gcr.io/k8s-staging-test-infra/kubekins-e2e:latest-1.32
      command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # procps for pkill: cleanup() uses it to reap the heartbeat's
        # boskosctl child, and its `|| true` would swallow a missing binary.
        apt-get update && apt-get install -y --no-install-recommends gettext-base jq procps
        command -v gke-gcloud-auth-plugin >/dev/null
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh && chmod +x install-opentofu.sh && ./install-opentofu.sh --install-method standalone
        export GEMINI_API_KEY="$(cat /etc/gemini-secret/GEMINI_API_KEY)"
        # The bench verifier reads back the GitHub ledger issue the run
        # published and grades its contents; ledger_issue_contains has no
        # other credential source, and the *-infra repos are private.
        export BENCH_GITHUB_TOKEN="$(cat /etc/bench-github-token/BENCH_GITHUB_TOKEN)"
        # hack/ci-eval-pr.sh mints a 1-hour installation token per
        # devops-bench invocation and overwrites BENCH_GITHUB_TOKEN with it.
        # App 4739812 is read-only and scoped to the *-infra repos.
        # gke-labs/kube-agents#994.
        export EVAL_LEDGER_APP_KEY_FILE="/etc/ledger-app-key/key.pem"
        # Turns on the in-cluster token minter, which is what lets the agent
        # write that issue. An App ID is an identifier, not a credential:
        # minting requires signing a JWT with the App's private key, which
        # is non-exportable inside each pool project's Cloud KMS. What bounds
        # where a run can write is the App's installation list -- the
        # *-infra repos, repository_selection: selected -- not this value,
        # which gke-labs/kube-agents already publishes.
        export EVAL_GITHUB_APP_ID="4675512"
        export REQUIRE_CACHE="true"
        # The tier switch: hack/ci-eval-pr.sh appends its NIGHTLY_TASKS array
        # to the presubmit matrix on this value and refuses anything it does
        # not recognise. This export is the whole difference between this job
        # and the presubmit's eval step.
        export EVAL_TIER="nightly"
        # ─── spec.mode next ─────────────────────────────────────────────────
        # As ci-kube-agents-eval-nightly above: hack/ci-deploy.sh flips the
        # install to spec.mode next after the today-mode install has passed
        # its own gates, and hack/ci-eval-pr.sh runs this shard through the
        # gateway's inject door, less hack/eval/inject-lane-exclusions.txt.
        # The deploy admits the flag on this job, which has no PULL_NUMBER,
        # only by name (EVAL_MODE_NEXT_JOB_NAMES in hack/ci-deploy.sh, which
        # gke-labs/kube-agents#3934 extends: merge that first, or this job
        # reds at the deploy's refusal). bench-gate reads the inject transport
        # as the version key's next mode, so the lines this job appends file
        # under next and never reach today's window.
        export EVAL_MODE_NEXT="1"
        # ─── The agent model: the `nightly` pair of the eval-model Secret ─────────
        # The nightlies' pair, which every nightly and weekly periodic reads;
        # the gate's record is built from these runs, so `gate.name` must name
        # the same model or rung 6 compares nothing.
        # Mounted at /etc/eval-model from kube-agents-eval-model (namespace
        # test-pods on build-kube-agents). The mechanism and its reasons are on
        # pull-kube-agents-smoke-test's block in kube-agents-presubmits.yaml;
        # this block sets no model, and a switch is one write to the Secret.
        MODEL_PROVIDER="$(tr -d '[:space:]' < /etc/eval-model/nightly.provider)"
        MODEL_DEFAULT_NAME="$(tr -d '[:space:]' < /etc/eval-model/nightly.name)"
        : "${MODEL_PROVIDER:?eval-model Secret: nightly.provider is missing or empty}"
        : "${MODEL_DEFAULT_NAME:?eval-model Secret: nightly.name is missing or empty}"
        export MODEL_PROVIDER MODEL_DEFAULT_NAME
        export AGENT_MODEL_OVERRIDE="${MODEL_DEFAULT_NAME}"
        # The main part: everything but the cases that request a pull
        # request, which ci-kube-agents-eval-nightly-writers and its -b and -c
        # thirds below run on leased projects of their own
        # (gke-labs/kube-agents#2467, #4238). Those run one
        # unit at a time after every other unit, against the project's one
        # GitOps repository, and on one project that phase and the infra
        # lock's stretch did not fit 480m together. The main part itself is
        # split in five disjoint shards (gke-labs/kube-agents#3384, option C,
        # then #4238; the split lives in hack/ci-eval-pr.sh): this job runs
        # main-b, the stack-bearing cases hack/eval/nightly-main-b.txt lists;
        # ci-kube-agents-eval-nightly runs main-a and -main-c, -main-d and
        # -main-e run the other shards.
        export EVAL_NIGHTLY_PART="main-b"
        # 6 under spec.mode next, as ci-kube-agents-eval-nightly (its
        # comment says why).
        export EVAL_TASK_PARALLELISM="6"
        # ─── Baseline evidence store: ARMED ──────────────────────────────────
        # The bucket, the eval-baseline-recorder identity this job runs as,
        # and the grants on both are prerequisites -- docs/designs/
        # eval-scorer.md, "Provisioning it", in gke-labs/kube-agents. The
        # contract from hack/ci-eval-pr.sh's EVAL_BASELINE_STORE comment:
        # turning the store on is TWO Prow exports, not one. This nightly
        # holds objectViewer AND objectCreator on the bucket (it appends one
        # immutable object per case per night); the presubmit exports the
        # SAME variable with objectViewer only (it reads). Forgetting the
        # presubmit half is silent -- it keeps reading the empty checked-in
        # directory and reports a legitimate green with the rate-based rungs
        # inert. baseline-append.jsonl still rides as an artifact.
        #
        # EVAL_REPETITIONS stays at the script's default 3: at that count a
        # case reaches the 20-run admission bar after seven nights, and the
        # matrix already projects past this job's 360m at three (see the
        # timeout comment above). Raise it here on measured wall clock from
        # the first nights, not on arithmetic.
        export EVAL_BASELINE_STORE="gs://kube-agents-evals-bench/evidence"
        # ─── Ensure boskosctl is available (pinned version) ─────────────────────────
        # Named once, used by both the GCS fast path and the fallback below.
        BOSKOSCTL_VERSION="v0.0.0-20260730151943-11fb0c84248b"
        if ! command -v boskosctl >/dev/null; then
          # Prefer a binary staged in a bucket we own. gke-labs/kube-agents#943
          # died here: proxy.golang.org answered INTERNAL_ERROR and the job
          # exited before it had leased a project, so no task ran at all and
          # there was nothing for a rerun to repeat. A pinned binary does not
          # need the public module proxy on the critical path of every run.
          #
          # NOTE: gs://kube-agents-prow/tools/boskosctl-* does not exist yet.
          # Until somebody stages it, this copy always misses and the fallback
          # is the real path -- which is why the fallback is retried.
          if gsutil -q cp "gs://kube-agents-prow/tools/boskosctl-${BOSKOSCTL_VERSION}" /usr/local/bin/boskosctl; then
            chmod +x /usr/local/bin/boskosctl
            echo "✓ boskosctl ${BOSKOSCTL_VERSION} restored from GCS"
          else
            echo "boskosctl ${BOSKOSCTL_VERSION} not in GCS; falling back to the module proxy"
            for attempt in 1 2 3; do
              if GOBIN=/usr/local/bin go install "sigs.k8s.io/boskos/cmd/boskosctl@${BOSKOSCTL_VERSION}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "ERROR: go install boskosctl failed 3 times; proxy.golang.org is the usual cause"
                exit 1
              fi
              echo "go install attempt ${attempt} failed; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            done
          fi
        fi

        # ─── Boskos Lease, Heartbeat & Cleanup Handler ──────────────────────────────
        BOSKOS_SERVER="http://boskos.boskos.svc.cluster.local"
        BOSKOS_RESOURCE_TYPE="kube-agents-evals-project"
        BOSKOS_OWNER="${JOB_NAME}-${BUILD_ID}"
        BOSKOSCTL=(boskosctl --server-url="${BOSKOS_SERVER}" --owner-name="${BOSKOS_OWNER}")

        echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Leasing GCP Project from Boskos ==="
        # 90m, not the presubmit's 10m: the eight nightly parts lease together at
        # 00:00 UTC against a pool the presubmit herd may have filled, and the
        # wait comes out of this part's own timeout (gke-labs/kube-agents#5472).
        RESOURCE="$("${BOSKOSCTL[@]}" acquire --type="${BOSKOS_RESOURCE_TYPE}" \
          --state=free --target-state=busy --timeout=90m)"
        LEASED_PROJECT="$(echo "${RESOURCE}" | jq -r .name)"
        if [ -z "${LEASED_PROJECT}" ] || [ "${LEASED_PROJECT}" = "null" ]; then
          echo "ERROR: could not parse leased project from: ${RESOURCE}"
          exit 1
        fi
        export PROJECT_ID="${LEASED_PROJECT}"
        echo "✓ Successfully leased project: ${PROJECT_ID}"

        # Marks "teardown has begun" for the heartbeat's abort fallback. Its
        # directory is created fresh by mktemp -d, so the sentinel provably
        # does not exist until cleanup() creates it -- a fixed path could be
        # left behind by an earlier run and would silence the abort for the
        # whole job.
        TEARDOWN_DIR="$(mktemp -d)"
        TEARDOWN_SENTINEL="${TEARDOWN_DIR}/teardown-begun"

        cleanup() {
          local rc=$?
          trap - EXIT INT TERM
          # Before the kills, and this ordering is the point. If the
          # heartbeat exhausts its retries in the window between `trap -`
          # above and the subshell actually dying, its `kill -TERM $$`
          # fallback lands with no handler installed and terminates this
          # script mid-teardown -- before ci-teardown.sh finishes and before
          # the Boskos release, leaking GKE resources into a project the next
          # lease hands straight to somebody else. The sentinel silences the
          # fallback for an expiry during intentional teardown only; a
          # heartbeat that dies mid-eval still aborts the run.
          touch "${TEARDOWN_SENTINEL}"
          # boskosctl is a child of the subshell, not the subshell itself:
          # the subshell body is a compound command, so bash does not
          # exec-optimise it away. Killing only ${HEARTBEAT_PID} orphans a
          # heartbeat that keeps beating a resource this cleanup is about to
          # release, and Boskos answers 401 Unauthorized on the owner
          # mismatch -- nine of them, matching --retries=8. That reads like a
          # credential problem next to a Boskos release and is not one.
          pkill -P "${HEARTBEAT_PID:-0}" 2>/dev/null || true
          kill "${HEARTBEAT_PID:-}" 2>/dev/null || true
          kill "${STEP_PID:-}" 2>/dev/null || true
          echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Running CI Teardown ==="
          ./hack/ci-teardown.sh || true
          if [ -n "${LEASED_PROJECT:-}" ] && [ "${LEASED_PROJECT}" != "null" ]; then
            echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Releasing Boskos Project: ${LEASED_PROJECT} ==="
            "${BOSKOSCTL[@]}" release --name="${LEASED_PROJECT}" --target-state=free || true
          fi
          exit $rc
        }
        trap cleanup EXIT INT TERM

        # The abort fallback fires only while the eval is still running. Once
        # cleanup() has touched the sentinel the resource is on its way back
        # to the pool, so an expiring heartbeat is expected and must not
        # signal a script that is mid-teardown. `$$` is still this script's
        # PID inside the subshell, which is what the comment below is about.
        #
        # --timeout outlives the job, and ANY exit of the heartbeat aborts the
        # run, exit 0 included. boskosctl stops beating at its --timeout (5h by
        # default) and exits 0; four kube-agents smoke runs held past that point
        # on 2026-10-14 lost their leases while still running, the reaper handed
        # their projects to other runs, and at the ceiling their teardowns
        # uninstalled the new tenants (gke-labs/kube-agents#3129). This job's
        # timeout is 840m, so a heartbeat that stops before then means the
        # project is about to be taken away, whatever its exit status says.
        ( "${BOSKOSCTL[@]}" heartbeat --resource "${RESOURCE}" --period=30s --retries=8 --timeout=860m || true
          [ -e "${TEARDOWN_SENTINEL}" ] || kill -TERM $$ ) &
        HEARTBEAT_PID=$!

        # Every step runs in the background and is waited on, because bash
        # defers a trapped signal until the *foreground* command completes.
        # Run in the foreground, a heartbeat failure mid-eval would sit
        # pending for the rest of the multi-hour step -- long past the 5m
        # Boskos reaper window, so a concurrent run could lease the same
        # project -- and if the step then exited 0, cleanup would capture
        # rc=0 and the job would go green having never run the eval. `wait`
        # is interruptible, so the trap fires immediately and cleanup sees
        # 143.
        #
        # Signalling the process group (kill -TERM 0) also interrupts
        # promptly, but prow's entrypoint starts the job without Setpgid
        # (sigs.k8s.io/prow pkg/entrypoint/run.go), so the group includes the
        # entrypoint itself: it would mark the job aborted and SIGKILL this
        # script once grace_period expires, cutting teardown and the Boskos
        # release short. This form does not depend on that topology.
        run_step() { "$@" & STEP_PID=$!; wait "${STEP_PID}"; }

        # Clean up any leftover state if a previous job was hard-killed
        run_step ./hack/ci-teardown.sh || true
        run_step ./hack/ci-connection-test.sh
        run_step ./hack/ci-deploy.sh
        run_step ./hack/ci-eval-pr.sh
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
      volumeMounts:
      - name: gemini-secret
        mountPath: /etc/gemini-secret
        readOnly: true
      - name: eval-model
        mountPath: /etc/eval-model
        readOnly: true
      - name: bench-github-token
        mountPath: /etc/bench-github-token
        readOnly: true
      - name: ledger-app-key
        mountPath: /etc/ledger-app-key
        readOnly: true
    volumes:
    - name: gemini-secret
      secret:
        secretName: kube-agents-gemini-api-key
    - name: eval-model
      secret:
        secretName: kube-agents-eval-model
    - name: bench-github-token
      secret:
        secretName: kube-agents-bench-github-token
    - name: ledger-app-key
      secret:
        secretName: kube-agents-evals-ledger-app-key
- name: ci-kube-agents-certification-1
  # The certification lane, slice 1 (gke-labs/kube-agents#3978): the cases
  # behind the certified-capabilities page, graded on a lane of their own.
  # EVAL_TIER=certification below makes hack/ci-eval-pr.sh run
  # hack/eval/certification-cases.txt alone, and EVAL_CERTIFICATION_PART=1
  # its first `# part N` section; no presubmit or nightly case runs here, and
  # no certification case runs anywhere else, so each case holds one record on
  # one lane. The blocking roster is a subset of the presubmit, so rung 4 is
  # disarmed by construction: a failing certification case is a record for
  # the page, never a red. Otherwise this is ci-kube-agents-eval-nightly-main-b's
  # spec, copied, as the other parts are: the same lease pool, provisioning,
  # deploy, eval, teardown, identity and log bucket, so its logs land beside
  # the nightlies' under logs/ci-kube-agents-certification-1/ for the page's
  # fetcher. The Boskos owner, log path and build identity all derive from
  # JOB_NAME and BUILD_ID. Like the nightlies it grades spec.mode next
  # (EVAL_MODE_NEXT=1 below; hack/ci-deploy.sh admits this job by name).
  #
  # What it grades: a RELEASE, not main's head. The script below resolves the
  # newest GA version tag (0.24.0, ...) to the commit whose published images
  # the release promoted (scripts/release/common.sh resolve_source_image_commit:
  # the stamp commit's parent), checks the tree out there and hands the commit
  # to hack/ci-deploy.sh as RC_COMMIT_SHA, which installs the published
  # ghcr.io images at that commit and builds nothing, the way
  # post-kube-agents-eval-rc measures a candidate. The certification roster,
  # bench and tier are therefore the release's own: a release whose tree has
  # no certification case (no roster line and no task file with the suite
  # line; every release before the suite's first case merged) is logged and
  # skipped with exit 0, so the page reads "No run" for it rather than the
  # lane reading red. The tag, the commit and the registry
  # are written to artifacts/release-under-test.json for the page's fetcher,
  # which groups repetitions by release.
  #
  # EVAL_REPETITIONS=3 and EVAL_TASK_PARALLELISM=1 while the suite is built
  # out. One window per release, scored by the page's 57-of-60 rule (a Wilson
  # 95 percent lower bound of 0.85) over every scored repetition of that
  # release across builds; a repetition the harness records as infrastructure
  # (KUBE_AGENTS_INFRA_FAILURE) sits outside the scored count. At 3 per build
  # no release reaches 60, so every page cell reads "n of 60, not enough
  # runs" and nothing is certified; the count rises on measured unit times
  # once the roster's parts are sized (the harness writes a case's record
  # only after its last repetition, grade_case in hack/ci-eval-pr.sh, so a
  # build must finish every case it starts: a deadline-cut build records
  # nothing for the case it was in). The later shape, once the harness
  # writes the case record per repetition: one 60-repetition build under a
  # longer timeout. The lane is serial under the harness's infrastructure
  # lock, so the parallelism buys nothing and 1 keeps one plant on the host
  # at a time.
  #
  # Saturday and Sunday 14:00 UTC (09:00 EST): after the nightlies end and in
  # the window the pool is idle (the pool-pressure reading over the week
  # before this job landed: 1 to 2 free projects at the nightlies' hour on a
  # weeknight, about 30 on a weekend morning). Horologium creates the run on
  # the cron, which is what gives Deck a ProwJob to Rerun from: a periodic
  # whose schedule never fires has no run and no Rerun button. One release a
  # week is graded, the newest GA at each cron (both days read the same tag
  # unless a release lands between them, when Sunday's build starts the next
  # release's window); a Rerun grades the newest GA of its day. A second
  # slice (ci-kube-agents-certification-2, EVAL_CERTIFICATION_PART=2) is
  # added when the roster's part 1 no longer fits the timeout.
  cluster: build-kube-agents
  cron: "0 14 * * 6,0"
  # A Rerun pressed while the weekly run is still going must queue, not
  # stack a second lease and a second full provisioning behind the first.
  max_concurrency: 1
  decorate: true
  decoration_config:
    # Provisional. At 3 repetitions per case the lane's unit of about 11
    # minutes (7.5 median on the api lane, 15.6 at the slowest) plus 45 to 60
    # minutes of setup ends well inside 720m for the parts the roster holds
    # now; the timeout stays where the first runs' wall clock, and the
    # repetition count as it rises, will size it, as the nightlies' did. A
    # build the deadline cuts inside a case records nothing for it (the job
    # comment above), so the margin is kept wide.
    timeout: 720m
    grace_period: 5m
    # Logs and artifacts go to a bucket kube-agents owns, NOT the cluster
    # default gs://kube-agents-prow (prow/oss/config.yaml, build-kube-agents).
    # This job runs as eval-baseline-recorder (see serviceAccountName below),
    # and that identity has no write on kube-agents-prow, which the oss-prow
    # team owns: night one died in initupload with a 403 on
    # storage.objects.create before the test container ever started (build
    # 2099649477534027776). Rather than ask for a grant on a bucket that is
    # not ours, the nightly uploads to one that is. Granted on it: this job's
    # identity and crier (oss-prow@oss-prow) as objectAdmin; Deck
    # (oss-prow-public-deck@oss-prow) and the ci-health collector
    # (github-actions@kube-agents-prow) as objectViewer. Only the bucket is
    # overridden: path_strategy and Workload Identity credentials come from
    # the cluster default, which Prow merges under a job-level override field
    # by field.
    gcs_configuration:
      bucket: kube-agents-evals-nightly-logs
  annotations:
    # No TestGrid tab on purpose: the team reads this run through the
    # certified-capabilities page and the eval dashboard
    # (gke-labs/kube-agents#1335) rather than a second UI, so the
    # googleoss-kube-agents dashboard keeps only the pool-pressure tab.
    testgrid-create-test-group: "false"
    description: Certification lane, slice 1, Saturday and Sunday 14:00 UTC and on Rerun. kube-agents certification suite graded on the newest GA release's published images under spec.mode next, 3 repetitions per case per build while the suite is built out, on its own project (gke-labs/kube-agents#3978).
  extra_refs:
  - org: gke-labs
    repo: kube-agents
    base_ref: main
    workdir: true
  spec:
    # NOT prowjob-default-sa, which the presubmit runs as. The read/write
    # split on the evidence bucket -- this job appends, a pull request only
    # reads -- is expressible only across two identities, because one account
    # cannot both hold and be denied objectCreator (docs/designs/eval-scorer.md,
    # "Two conditions that guard depends on", in gke-labs/kube-agents). The KSA
    # test-pods/eval-baseline-recorder and its Workload Identity binding to
    # eval-baseline-recorder@kube-agents-prow.iam.gserviceaccount.com are
    # prerequisites of this file: without them this pod does not schedule.
    serviceAccountName: eval-baseline-recorder
    containers:
    - image: gcr.io/k8s-staging-test-infra/kubekins-e2e:latest-1.32
      command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # procps for pkill: cleanup() uses it to reap the heartbeat's
        # boskosctl child, and its `|| true` would swallow a missing binary.
        apt-get update && apt-get install -y --no-install-recommends gettext-base jq procps
        command -v gke-gcloud-auth-plugin >/dev/null
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh && chmod +x install-opentofu.sh && ./install-opentofu.sh --install-method standalone
        export GEMINI_API_KEY="$(cat /etc/gemini-secret/GEMINI_API_KEY)"
        # The bench verifier reads back the GitHub ledger issue the run
        # published and grades its contents; ledger_issue_contains has no
        # other credential source, and the *-infra repos are private.
        export BENCH_GITHUB_TOKEN="$(cat /etc/bench-github-token/BENCH_GITHUB_TOKEN)"
        # hack/ci-eval-pr.sh mints a 1-hour installation token per
        # devops-bench invocation and overwrites BENCH_GITHUB_TOKEN with it.
        # App 4739812 is read-only and scoped to the *-infra repos.
        # gke-labs/kube-agents#994.
        export EVAL_LEDGER_APP_KEY_FILE="/etc/ledger-app-key/key.pem"
        # Turns on the in-cluster token minter, which is what lets the agent
        # write that issue. An App ID is an identifier, not a credential:
        # minting requires signing a JWT with the App's private key, which
        # is non-exportable inside each pool project's Cloud KMS. What bounds
        # where a run can write is the App's installation list -- the
        # *-infra repos, repository_selection: selected -- not this value,
        # which gke-labs/kube-agents already publishes.
        export EVAL_GITHUB_APP_ID="4675512"
        export REQUIRE_CACHE="true"
        # The tier switch: hack/ci-eval-pr.sh runs hack/eval/certification-cases.txt
        # alone on the first value and its `# part 1` section on the second;
        # it refuses anything it does not recognise. These two exports are the
        # whole difference between this job and the nightly's eval step.
        export EVAL_TIER="certification"
        export EVAL_CERTIFICATION_PART="1"
        # ─── spec.mode next ─────────────────────────────────────────────────
        # As ci-kube-agents-eval-nightly above: hack/ci-deploy.sh flips the
        # install to spec.mode next after the today-mode install has passed
        # its own gates, and hack/ci-eval-pr.sh runs the slice through the
        # gateway's inject door, less hack/eval/inject-lane-exclusions.txt.
        # The deploy admits the flag on this job, which has no PULL_NUMBER,
        # only by name (EVAL_MODE_NEXT_JOB_NAMES in hack/ci-deploy.sh, which
        # the kube-agents pull request that adds the tier extends: merge that
        # first, or this job reds at the deploy's refusal). bench-gate reads
        # the inject transport as the version key's next mode.
        export EVAL_MODE_NEXT="1"
        # ─── The agent model: the `nightly` pair of the eval-model Secret ─────────
        # The nightlies' pair, which every nightly and weekly periodic reads;
        # the gate's record is built from these runs, so `gate.name` must name
        # the same model or rung 6 compares nothing.
        # Mounted at /etc/eval-model from kube-agents-eval-model (namespace
        # test-pods on build-kube-agents). The mechanism and its reasons are on
        # pull-kube-agents-smoke-test's block in kube-agents-presubmits.yaml;
        # this block sets no model, and a switch is one write to the Secret.
        MODEL_PROVIDER="$(tr -d '[:space:]' < /etc/eval-model/nightly.provider)"
        MODEL_DEFAULT_NAME="$(tr -d '[:space:]' < /etc/eval-model/nightly.name)"
        : "${MODEL_PROVIDER:?eval-model Secret: nightly.provider is missing or empty}"
        : "${MODEL_DEFAULT_NAME:?eval-model Secret: nightly.name is missing or empty}"
        export MODEL_PROVIDER MODEL_DEFAULT_NAME
        export AGENT_MODEL_OVERRIDE="${MODEL_DEFAULT_NAME}"
        # 1, not the nightly's 6: every certification case carries a stack
        # and the harness runs stack-bearing units one at a time under its
        # infrastructure lock, so a wider fan-out buys nothing here. 3
        # repetitions per build while the suite is built out (the job comment
        # above); the count rises on measured unit times.
        export EVAL_TASK_PARALLELISM="1"
        export EVAL_REPETITIONS="3"
        # ─── Baseline evidence store: read only ─────────────────────────────
        # Exported for the read, like a presubmit. hack/ci-eval-pr.sh sets
        # EVAL_IS_MAIN_RUN=false under EVAL_TIER=certification, so this lane
        # appends nothing to the store; its record is the logs bucket above,
        # which the certified-capabilities page reads. The identity still
        # holds objectCreator because the spec is the nightly's, copied; the
        # script's opt-out is what keeps the write from happening.
        export EVAL_BASELINE_STORE="gs://kube-agents-evals-bench/evidence"
        # ─── Ensure boskosctl is available (pinned version) ─────────────────────────
        # Named once, used by both the GCS fast path and the fallback below.
        BOSKOSCTL_VERSION="v0.0.0-20260730151943-11fb0c84248b"
        if ! command -v boskosctl >/dev/null; then
          # Prefer a binary staged in a bucket we own. gke-labs/kube-agents#943
          # died here: proxy.golang.org answered INTERNAL_ERROR and the job
          # exited before it had leased a project, so no task ran at all and
          # there was nothing for a rerun to repeat. A pinned binary does not
          # need the public module proxy on the critical path of every run.
          #
          # NOTE: gs://kube-agents-prow/tools/boskosctl-* does not exist yet.
          # Until somebody stages it, this copy always misses and the fallback
          # is the real path -- which is why the fallback is retried.
          if gsutil -q cp "gs://kube-agents-prow/tools/boskosctl-${BOSKOSCTL_VERSION}" /usr/local/bin/boskosctl; then
            chmod +x /usr/local/bin/boskosctl
            echo "✓ boskosctl ${BOSKOSCTL_VERSION} restored from GCS"
          else
            echo "boskosctl ${BOSKOSCTL_VERSION} not in GCS; falling back to the module proxy"
            for attempt in 1 2 3; do
              if GOBIN=/usr/local/bin go install "sigs.k8s.io/boskos/cmd/boskosctl@${BOSKOSCTL_VERSION}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "ERROR: go install boskosctl failed 3 times; proxy.golang.org is the usual cause"
                exit 1
              fi
              echo "go install attempt ${attempt} failed; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            done
          fi
        fi

        # ─── Boskos Lease, Heartbeat & Cleanup Handler ──────────────────────────────
        BOSKOS_SERVER="http://boskos.boskos.svc.cluster.local"
        BOSKOS_RESOURCE_TYPE="kube-agents-evals-project"
        BOSKOS_OWNER="${JOB_NAME}-${BUILD_ID}"
        BOSKOSCTL=(boskosctl --server-url="${BOSKOS_SERVER}" --owner-name="${BOSKOS_OWNER}")

        # The release under test: the newest GA version tag, resolved to the
        # commit whose published images the release promoted. Resolved before
        # the lease, so a release with nothing to grade holds no project. The
        # checkout follows hack/ci-eval-rc.sh's order (resolve, detach, then
        # the RELEASE's scripts run), and RC_COMMIT_SHA makes the release's
        # hack/ci-deploy.sh install the published images at that commit.
        # shellcheck source=/dev/null
        source scripts/release/common.sh
        git fetch --quiet --tags origin
        GA_TAG="$(get_latest_ga_tag)"
        if [ -z "${GA_TAG}" ]; then
          echo "ERROR: no GA version tag in the clone; nothing to certify" >&2
          exit 1
        fi
        RELEASE_COMMIT="$(resolve_source_image_commit "${GA_TAG}")"
        echo "=== Release under test: ${GA_TAG} (images built at ${RELEASE_COMMIT}) ==="
        # A release carries the suite when its roster file lists a case or, once
        # the roster is generated from the task files, when any task.yaml carries
        # the suite line; either form admits the release.
        if ! git show "${RELEASE_COMMIT}:hack/eval/certification-cases.txt" 2>/dev/null | grep -q '^\./tasks/' \
          && ! git grep -q '^suite: certification$' "${RELEASE_COMMIT}" -- 'bench/tasks/*/task.yaml'; then
          echo "Release ${GA_TAG} carries no certification case (its tree predates the suite); nothing to grade, and the page reads No run for it."
          exit 0
        fi
        mkdir -p "${ARTIFACTS:-/logs/artifacts}"
        printf '{"release": "%s", "commit": "%s", "registry": "%s"}\n' "${GA_TAG}" "${RELEASE_COMMIT}" "$(get_registry_prefix)" \
          > "${ARTIFACTS:-/logs/artifacts}/release-under-test.json"
        git checkout --quiet --detach "${RELEASE_COMMIT}"
        export RC_COMMIT_SHA="${RELEASE_COMMIT}"

        echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Leasing GCP Project from Boskos ==="
        RESOURCE="$("${BOSKOSCTL[@]}" acquire --type="${BOSKOS_RESOURCE_TYPE}" \
          --state=free --target-state=busy --timeout=10m)"
        LEASED_PROJECT="$(echo "${RESOURCE}" | jq -r .name)"
        if [ -z "${LEASED_PROJECT}" ] || [ "${LEASED_PROJECT}" = "null" ]; then
          echo "ERROR: could not parse leased project from: ${RESOURCE}"
          exit 1
        fi
        export PROJECT_ID="${LEASED_PROJECT}"
        echo "✓ Successfully leased project: ${PROJECT_ID}"

        # Marks "teardown has begun" for the heartbeat's abort fallback. Its
        # directory is created fresh by mktemp -d, so the sentinel provably
        # does not exist until cleanup() creates it -- a fixed path could be
        # left behind by an earlier run and would silence the abort for the
        # whole job.
        TEARDOWN_DIR="$(mktemp -d)"
        TEARDOWN_SENTINEL="${TEARDOWN_DIR}/teardown-begun"

        cleanup() {
          local rc=$?
          trap - EXIT INT TERM
          # Before the kills, and this ordering is the point. If the
          # heartbeat exhausts its retries in the window between `trap -`
          # above and the subshell actually dying, its `kill -TERM $$`
          # fallback lands with no handler installed and terminates this
          # script mid-teardown -- before ci-teardown.sh finishes and before
          # the Boskos release, leaking GKE resources into a project the next
          # lease hands straight to somebody else. The sentinel silences the
          # fallback for an expiry during intentional teardown only; a
          # heartbeat that dies mid-eval still aborts the run.
          touch "${TEARDOWN_SENTINEL}"
          # boskosctl is a child of the subshell, not the subshell itself:
          # the subshell body is a compound command, so bash does not
          # exec-optimise it away. Killing only ${HEARTBEAT_PID} orphans a
          # heartbeat that keeps beating a resource this cleanup is about to
          # release, and Boskos answers 401 Unauthorized on the owner
          # mismatch -- nine of them, matching --retries=8. That reads like a
          # credential problem next to a Boskos release and is not one.
          pkill -P "${HEARTBEAT_PID:-0}" 2>/dev/null || true
          kill "${HEARTBEAT_PID:-}" 2>/dev/null || true
          kill "${STEP_PID:-}" 2>/dev/null || true
          echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Running CI Teardown ==="
          ./hack/ci-teardown.sh || true
          if [ -n "${LEASED_PROJECT:-}" ] && [ "${LEASED_PROJECT}" != "null" ]; then
            echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Releasing Boskos Project: ${LEASED_PROJECT} ==="
            "${BOSKOSCTL[@]}" release --name="${LEASED_PROJECT}" --target-state=free || true
          fi
          exit $rc
        }
        trap cleanup EXIT INT TERM

        # The abort fallback fires only while the eval is still running. Once
        # cleanup() has touched the sentinel the resource is on its way back
        # to the pool, so an expiring heartbeat is expected and must not
        # signal a script that is mid-teardown. `$$` is still this script's
        # PID inside the subshell, which is what the comment below is about.
        #
        # --timeout outlives the job, and ANY exit of the heartbeat aborts the
        # run, exit 0 included. boskosctl stops beating at its --timeout (5h by
        # default) and exits 0; four kube-agents smoke runs held past that point
        # on 2026-10-14 lost their leases while still running, the reaper handed
        # their projects to other runs, and at the ceiling their teardowns
        # uninstalled the new tenants (gke-labs/kube-agents#3129). This job's
        # timeout is 480m, so a heartbeat that stops before then means the
        # project is about to be taken away, whatever its exit status says.
        ( "${BOSKOSCTL[@]}" heartbeat --resource "${RESOURCE}" --period=30s --retries=8 --timeout=740m || true
          [ -e "${TEARDOWN_SENTINEL}" ] || kill -TERM $$ ) &
        HEARTBEAT_PID=$!

        # Every step runs in the background and is waited on, because bash
        # defers a trapped signal until the *foreground* command completes.
        # Run in the foreground, a heartbeat failure mid-eval would sit
        # pending for the rest of the multi-hour step -- long past the 5m
        # Boskos reaper window, so a concurrent run could lease the same
        # project -- and if the step then exited 0, cleanup would capture
        # rc=0 and the job would go green having never run the eval. `wait`
        # is interruptible, so the trap fires immediately and cleanup sees
        # 143.
        #
        # Signalling the process group (kill -TERM 0) also interrupts
        # promptly, but prow's entrypoint starts the job without Setpgid
        # (sigs.k8s.io/prow pkg/entrypoint/run.go), so the group includes the
        # entrypoint itself: it would mark the job aborted and SIGKILL this
        # script once grace_period expires, cutting teardown and the Boskos
        # release short. This form does not depend on that topology.
        run_step() { "$@" & STEP_PID=$!; wait "${STEP_PID}"; }

        # Clean up any leftover state if a previous job was hard-killed
        run_step ./hack/ci-teardown.sh || true
        run_step ./hack/ci-connection-test.sh
        run_step ./hack/ci-deploy.sh
        run_step ./hack/ci-eval-pr.sh
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
      volumeMounts:
      - name: gemini-secret
        mountPath: /etc/gemini-secret
        readOnly: true
      - name: eval-model
        mountPath: /etc/eval-model
        readOnly: true
      - name: bench-github-token
        mountPath: /etc/bench-github-token
        readOnly: true
      - name: ledger-app-key
        mountPath: /etc/ledger-app-key
        readOnly: true
    volumes:
    - name: gemini-secret
      secret:
        secretName: kube-agents-gemini-api-key
    - name: eval-model
      secret:
        secretName: kube-agents-eval-model
    - name: bench-github-token
      secret:
        secretName: kube-agents-bench-github-token
    - name: ledger-app-key
      secret:
        secretName: kube-agents-evals-ledger-app-key
# The GitLab lane's nightly (gke-labs/kube-agents#2832): the GitHub nightly's
# shape with EVAL_FORGE=gitlab, two hours after it so the two do not compete
# for pool projects at midnight, one at a time. The script runs the lane's
# list (hack/eval/gitlab-cases.txt), not the catalogue, with no part split,
# and records nothing in the evidence store; EVAL_BASELINE_STORE stays set
# for the read, as on a presubmit, and the recorder's own guard refuses the
# write under this forge.
- name: ci-kube-agents-eval-nightly-main-c
  # The main-c shard of the nightly's main part (gke-labs/kube-agents#4238).
  # On gemini-4-argon the main-a half was cut at its 840m budget on five of
  # seven nights (10-31 to 11-06) while main-b, with as many stack cases, ran
  # 449-749m: main-a also carries the onboarding cases' chain, five cases
  # under one state lock, 380-480m of wall clock on its own. hack/ci-eval-pr.sh
  # now runs the main part as five shards, EVAL_NIGHTLY_PART=main-a to
  # main-e: main-a keeps the onboarding chain and no other stack case, and
  # hack/eval/nightly-main-b.txt to nightly-main-e.txt deal every other
  # stack case across main-b to main-e, so a new stack case leaves hours of
  # headroom under 840m. Otherwise this is the main-b
  # job's spec, copied: the same lease pool, provisioning, deploy, eval,
  # teardown, identity, cron and log bucket, so its baseline records and its
  # logs land where the other parts' do (the dashboard joins the builds into
  # one night). The shards' cases are disjoint, so no case is recorded twice
  # a night. The Boskos owner, log path and build identity all derive from
  # JOB_NAME and BUILD_ID, so nothing below needs to differ by hand. The
  # deploy admits EVAL_MODE_NEXT=1 here by job name (EVAL_MODE_NEXT_JOB_NAMES
  # in hack/ci-deploy.sh), so until the gke-labs/kube-agents change that adds
  # this name merges this job reds at the deploy's refusal, a minute after
  # its lease. That is the expected state for the night between the two
  # merges: this change lands first, because the kube-agents change gives
  # main-a and main-b their new, narrower meaning the night it lands, and the
  # cases of main-c, main-d and main-e would run nowhere until these jobs exist.
  cluster: build-kube-agents
  # 00:00 UTC (8 PM EDT / 7 PM EST; 5 PM / 4 PM Pacific): after the working
  # day's presubmit herd in the team's Eastern time zone, so the nightly's
  # model-quota draw rarely contends with pull requests, and the night is
  # over before the next morning's 11 AM ET digest reports it. The herd can
  # still hold the pool at this hour (34 smoke runs did on 2026-11-11,
  # gke-labs/kube-agents#5472), so the acquire below waits up to 90m of this
  # part's own timeout for a project.
  # ci-kube-agents-pool-pressure above fires at :23 and leases nothing from
  # Boskos, so the two never contend.
  cron: "0 0 * * *"
  # A slow nightly must skip the next tick, not stack a second lease and a
  # second full provisioning behind it.
  max_concurrency: 1
  decorate: true
  decoration_config:
    # The presubmit's 360m budget, for a bigger matrix. Priced from the
    # NIGHTLY_TASKS comment in hack/ci-eval-pr.sh as of 2026-09-10: the
    # eighteen presubmit tasks are ~211min SERIAL (the twenty-task ~317min
    # of build 2094442155576659968 less the ~106min #1218 moved out), and
    # the eight nightly-only entries add ~321-341min (five recast cases
    # ~190min, the two tofu incumbents ~106min, knowledge-grounding
    # ~25-45min): twenty-six tasks, ~532-552min serial at three repetitions.
    # The presubmit's parallel runs on 2026-09-10 realised ~1.15x at
    # EVAL_TASK_PARALLELISM=4 (177-217min whole-job for the ~211min-serial
    # matrix) under the daytime herd's model-quota contention; at that rate
    # the nightly projects to ~470-490min, which 360m would truncate most
    # nights. 480m fits with margin, and this job is non-gating, so a long
    # night costs a lease and nothing else (gke-labs/kube-agents#1491). The
    # nightly also runs at EVAL_TASK_PARALLELISM=8 (exported below): it is
    # alone on the quota at this hour. Measured over the first six nights
    # (2026-09-16..21, gke-labs/kube-agents#1491): the matrix grew to 41
    # cases / 123 units and spent 1734-2693 serial minutes a night; at
    # parallelism 6 the fan-out realised 5.4-5.8x, so three of six nights ran
    # to this deadline and recorded nothing. At 8 the worst night so far fits
    # in ~6h; the budget stays 480m. Back to 6 under spec.mode next (see the
    # export below).
    # 720m -> 840m for the gemini-4-argon window (oss-test-infra#2758): the first
    # Argon night (2026-10-29) cut main-a at 720m with 252 of 255 units done,
    # ~750m needed, and main-b took 550m. A run cut at 840m ends by 14:06 UTC;
    # the ci-health digest moves to 11 AM Toronto to stay after that, and the
    # dashboard's running window to 14h30m (gke-labs/kube-agents#4238).
    # Before that, 480m -> 720m with the move to Claude (gke-labs/kube-agents#3384): the
    # whole main part on claude-opus-5 at parallelism 8 replays to a median
    # of 426min and a maximum of 528min over the nine Claude nights
    # 10-08..16. Split into two halves on two leased projects (option C
    # there), the same replay puts each half at a ~219min median and a
    # ~305min maximum. Each half keeps 720m all the same: that replay is
    # today-mode at parallelism 8, and the first spec.mode next night (build
    # 2113782591592075264, the whole main part at parallelism 6, 23min of it
    # the next-mode deploy) ran to 720m with about 20 cases finished. A run
    # cut at 720m still ends by 12:00 UTC, before the 15:00 UTC digest (11 AM Toronto; gke-labs/kube-agents#4238).
    timeout: 840m
    grace_period: 5m
    # Logs and artifacts go to a bucket kube-agents owns, NOT the cluster
    # default gs://kube-agents-prow (prow/oss/config.yaml, build-kube-agents).
    # This job runs as eval-baseline-recorder (see serviceAccountName below),
    # and that identity has no write on kube-agents-prow, which the oss-prow
    # team owns: night one died in initupload with a 403 on
    # storage.objects.create before the test container ever started (build
    # 2099649477534027776). Rather than ask for a grant on a bucket that is
    # not ours, the nightly uploads to one that is. Granted on it: this job's
    # identity and crier (oss-prow@oss-prow) as objectAdmin; Deck
    # (oss-prow-public-deck@oss-prow) and the ci-health collector
    # (github-actions@kube-agents-prow) as objectViewer. Only the bucket is
    # overridden: path_strategy and Workload Identity credentials come from
    # the cluster default, which Prow merges under a job-level override field
    # by field.
    gcs_configuration:
      bucket: kube-agents-evals-nightly-logs
  annotations:
    # No TestGrid tab on purpose: the team reads this run through the eval
    # dashboard (gke-labs/kube-agents#1335) rather than a second UI, so the
    # googleoss-kube-agents dashboard keeps only the pool-pressure tab.
    testgrid-create-test-group: "false"
    description: Nightly kube-agents eval on main under spec.mode next, the main-c shard of the main part (the stack-bearing cases hack/eval/nightly-main-c.txt lists), on its own project (gke-labs/kube-agents#4238).
  extra_refs:
  - org: gke-labs
    repo: kube-agents
    base_ref: main
    workdir: true
  spec:
    # NOT prowjob-default-sa, which the presubmit runs as. The read/write
    # split on the evidence bucket -- this job appends, a pull request only
    # reads -- is expressible only across two identities, because one account
    # cannot both hold and be denied objectCreator (docs/designs/eval-scorer.md,
    # "Two conditions that guard depends on", in gke-labs/kube-agents). The KSA
    # test-pods/eval-baseline-recorder and its Workload Identity binding to
    # eval-baseline-recorder@kube-agents-prow.iam.gserviceaccount.com are
    # prerequisites of this file: without them this pod does not schedule.
    serviceAccountName: eval-baseline-recorder
    containers:
    - image: gcr.io/k8s-staging-test-infra/kubekins-e2e:latest-1.32
      command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # procps for pkill: cleanup() uses it to reap the heartbeat's
        # boskosctl child, and its `|| true` would swallow a missing binary.
        apt-get update && apt-get install -y --no-install-recommends gettext-base jq procps
        command -v gke-gcloud-auth-plugin >/dev/null
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh && chmod +x install-opentofu.sh && ./install-opentofu.sh --install-method standalone
        export GEMINI_API_KEY="$(cat /etc/gemini-secret/GEMINI_API_KEY)"
        # The bench verifier reads back the GitHub ledger issue the run
        # published and grades its contents; ledger_issue_contains has no
        # other credential source, and the *-infra repos are private.
        export BENCH_GITHUB_TOKEN="$(cat /etc/bench-github-token/BENCH_GITHUB_TOKEN)"
        # hack/ci-eval-pr.sh mints a 1-hour installation token per
        # devops-bench invocation and overwrites BENCH_GITHUB_TOKEN with it.
        # App 4739812 is read-only and scoped to the *-infra repos.
        # gke-labs/kube-agents#994.
        export EVAL_LEDGER_APP_KEY_FILE="/etc/ledger-app-key/key.pem"
        # Turns on the in-cluster token minter, which is what lets the agent
        # write that issue. An App ID is an identifier, not a credential:
        # minting requires signing a JWT with the App's private key, which
        # is non-exportable inside each pool project's Cloud KMS. What bounds
        # where a run can write is the App's installation list -- the
        # *-infra repos, repository_selection: selected -- not this value,
        # which gke-labs/kube-agents already publishes.
        export EVAL_GITHUB_APP_ID="4675512"
        export REQUIRE_CACHE="true"
        # The tier switch: hack/ci-eval-pr.sh appends its NIGHTLY_TASKS array
        # to the presubmit matrix on this value and refuses anything it does
        # not recognise. This export is the whole difference between this job
        # and the presubmit's eval step.
        export EVAL_TIER="nightly"
        # ─── spec.mode next ─────────────────────────────────────────────────
        # As ci-kube-agents-eval-nightly above: hack/ci-deploy.sh flips the
        # install to spec.mode next after the today-mode install has passed
        # its own gates, and hack/ci-eval-pr.sh runs this shard through the
        # gateway's inject door, less hack/eval/inject-lane-exclusions.txt.
        # The deploy admits the flag on this job, which has no PULL_NUMBER,
        # only by name (EVAL_MODE_NEXT_JOB_NAMES in hack/ci-deploy.sh, which
        # the gke-labs/kube-agents change that teaches hack/ci-eval-pr.sh the
        # main-c part also extends; until it merges this job reds at the
        # deploy's refusal, as the header says). bench-gate reads the inject transport
        # as the version key's next mode, so the lines this job appends file
        # under next and never reach today's window.
        export EVAL_MODE_NEXT="1"
        # ─── The agent model: the `nightly` pair of the eval-model Secret ─────────
        # The nightlies' pair, which every nightly and weekly periodic reads;
        # the gate's record is built from these runs, so `gate.name` must name
        # the same model or rung 6 compares nothing.
        # Mounted at /etc/eval-model from kube-agents-eval-model (namespace
        # test-pods on build-kube-agents). The mechanism and its reasons are on
        # pull-kube-agents-smoke-test's block in kube-agents-presubmits.yaml;
        # this block sets no model, and a switch is one write to the Secret.
        MODEL_PROVIDER="$(tr -d '[:space:]' < /etc/eval-model/nightly.provider)"
        MODEL_DEFAULT_NAME="$(tr -d '[:space:]' < /etc/eval-model/nightly.name)"
        : "${MODEL_PROVIDER:?eval-model Secret: nightly.provider is missing or empty}"
        : "${MODEL_DEFAULT_NAME:?eval-model Secret: nightly.name is missing or empty}"
        export MODEL_PROVIDER MODEL_DEFAULT_NAME
        export AGENT_MODEL_OVERRIDE="${MODEL_DEFAULT_NAME}"
        # The main part: everything but the cases that request a pull
        # request, which ci-kube-agents-eval-nightly-writers and its -b and -c
        # thirds below run on leased projects of their own
        # (gke-labs/kube-agents#2467, #4238). Those run one
        # unit at a time after every other unit, against the project's one
        # GitOps repository, and on one project that phase and the infra
        # lock's stretch did not fit 480m together. The main part itself is
        # split in five disjoint shards (gke-labs/kube-agents#3384, option C,
        # then #4238; the split lives in hack/ci-eval-pr.sh): this job runs
        # main-c, the stack-bearing cases hack/eval/nightly-main-c.txt lists;
        # ci-kube-agents-eval-nightly runs main-a and -main-b, -main-d and
        # -main-e run the other shards.
        export EVAL_NIGHTLY_PART="main-c"
        # 6 under spec.mode next, as ci-kube-agents-eval-nightly (its
        # comment says why).
        export EVAL_TASK_PARALLELISM="6"
        # ─── Baseline evidence store: ARMED ──────────────────────────────────
        # The bucket, the eval-baseline-recorder identity this job runs as,
        # and the grants on both are prerequisites -- docs/designs/
        # eval-scorer.md, "Provisioning it", in gke-labs/kube-agents. The
        # contract from hack/ci-eval-pr.sh's EVAL_BASELINE_STORE comment:
        # turning the store on is TWO Prow exports, not one. This nightly
        # holds objectViewer AND objectCreator on the bucket (it appends one
        # immutable object per case per night); the presubmit exports the
        # SAME variable with objectViewer only (it reads). Forgetting the
        # presubmit half is silent -- it keeps reading the empty checked-in
        # directory and reports a legitimate green with the rate-based rungs
        # inert. baseline-append.jsonl still rides as an artifact.
        #
        # EVAL_REPETITIONS stays at the script's default 3: at that count a
        # case reaches the 20-run admission bar after seven nights, and the
        # matrix already projects past this job's 360m at three (see the
        # timeout comment above). Raise it here on measured wall clock from
        # the first nights, not on arithmetic.
        export EVAL_BASELINE_STORE="gs://kube-agents-evals-bench/evidence"
        # ─── Ensure boskosctl is available (pinned version) ─────────────────────────
        # Named once, used by both the GCS fast path and the fallback below.
        BOSKOSCTL_VERSION="v0.0.0-20260730151943-11fb0c84248b"
        if ! command -v boskosctl >/dev/null; then
          # Prefer a binary staged in a bucket we own. gke-labs/kube-agents#943
          # died here: proxy.golang.org answered INTERNAL_ERROR and the job
          # exited before it had leased a project, so no task ran at all and
          # there was nothing for a rerun to repeat. A pinned binary does not
          # need the public module proxy on the critical path of every run.
          #
          # NOTE: gs://kube-agents-prow/tools/boskosctl-* does not exist yet.
          # Until somebody stages it, this copy always misses and the fallback
          # is the real path -- which is why the fallback is retried.
          if gsutil -q cp "gs://kube-agents-prow/tools/boskosctl-${BOSKOSCTL_VERSION}" /usr/local/bin/boskosctl; then
            chmod +x /usr/local/bin/boskosctl
            echo "✓ boskosctl ${BOSKOSCTL_VERSION} restored from GCS"
          else
            echo "boskosctl ${BOSKOSCTL_VERSION} not in GCS; falling back to the module proxy"
            for attempt in 1 2 3; do
              if GOBIN=/usr/local/bin go install "sigs.k8s.io/boskos/cmd/boskosctl@${BOSKOSCTL_VERSION}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "ERROR: go install boskosctl failed 3 times; proxy.golang.org is the usual cause"
                exit 1
              fi
              echo "go install attempt ${attempt} failed; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            done
          fi
        fi

        # ─── Boskos Lease, Heartbeat & Cleanup Handler ──────────────────────────────
        BOSKOS_SERVER="http://boskos.boskos.svc.cluster.local"
        BOSKOS_RESOURCE_TYPE="kube-agents-evals-project"
        BOSKOS_OWNER="${JOB_NAME}-${BUILD_ID}"
        BOSKOSCTL=(boskosctl --server-url="${BOSKOS_SERVER}" --owner-name="${BOSKOS_OWNER}")

        echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Leasing GCP Project from Boskos ==="
        # 90m, not the presubmit's 10m: the eight nightly parts lease together at
        # 00:00 UTC against a pool the presubmit herd may have filled, and the
        # wait comes out of this part's own timeout (gke-labs/kube-agents#5472).
        RESOURCE="$("${BOSKOSCTL[@]}" acquire --type="${BOSKOS_RESOURCE_TYPE}" \
          --state=free --target-state=busy --timeout=90m)"
        LEASED_PROJECT="$(echo "${RESOURCE}" | jq -r .name)"
        if [ -z "${LEASED_PROJECT}" ] || [ "${LEASED_PROJECT}" = "null" ]; then
          echo "ERROR: could not parse leased project from: ${RESOURCE}"
          exit 1
        fi
        export PROJECT_ID="${LEASED_PROJECT}"
        echo "✓ Successfully leased project: ${PROJECT_ID}"

        # Marks "teardown has begun" for the heartbeat's abort fallback. Its
        # directory is created fresh by mktemp -d, so the sentinel provably
        # does not exist until cleanup() creates it -- a fixed path could be
        # left behind by an earlier run and would silence the abort for the
        # whole job.
        TEARDOWN_DIR="$(mktemp -d)"
        TEARDOWN_SENTINEL="${TEARDOWN_DIR}/teardown-begun"

        cleanup() {
          local rc=$?
          trap - EXIT INT TERM
          # Before the kills, and this ordering is the point. If the
          # heartbeat exhausts its retries in the window between `trap -`
          # above and the subshell actually dying, its `kill -TERM $$`
          # fallback lands with no handler installed and terminates this
          # script mid-teardown -- before ci-teardown.sh finishes and before
          # the Boskos release, leaking GKE resources into a project the next
          # lease hands straight to somebody else. The sentinel silences the
          # fallback for an expiry during intentional teardown only; a
          # heartbeat that dies mid-eval still aborts the run.
          touch "${TEARDOWN_SENTINEL}"
          # boskosctl is a child of the subshell, not the subshell itself:
          # the subshell body is a compound command, so bash does not
          # exec-optimise it away. Killing only ${HEARTBEAT_PID} orphans a
          # heartbeat that keeps beating a resource this cleanup is about to
          # release, and Boskos answers 401 Unauthorized on the owner
          # mismatch -- nine of them, matching --retries=8. That reads like a
          # credential problem next to a Boskos release and is not one.
          pkill -P "${HEARTBEAT_PID:-0}" 2>/dev/null || true
          kill "${HEARTBEAT_PID:-}" 2>/dev/null || true
          kill "${STEP_PID:-}" 2>/dev/null || true
          echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Running CI Teardown ==="
          ./hack/ci-teardown.sh || true
          if [ -n "${LEASED_PROJECT:-}" ] && [ "${LEASED_PROJECT}" != "null" ]; then
            echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Releasing Boskos Project: ${LEASED_PROJECT} ==="
            "${BOSKOSCTL[@]}" release --name="${LEASED_PROJECT}" --target-state=free || true
          fi
          exit $rc
        }
        trap cleanup EXIT INT TERM

        # The abort fallback fires only while the eval is still running. Once
        # cleanup() has touched the sentinel the resource is on its way back
        # to the pool, so an expiring heartbeat is expected and must not
        # signal a script that is mid-teardown. `$$` is still this script's
        # PID inside the subshell, which is what the comment below is about.
        #
        # --timeout outlives the job, and ANY exit of the heartbeat aborts the
        # run, exit 0 included. boskosctl stops beating at its --timeout (5h by
        # default) and exits 0; four kube-agents smoke runs held past that point
        # on 2026-10-14 lost their leases while still running, the reaper handed
        # their projects to other runs, and at the ceiling their teardowns
        # uninstalled the new tenants (gke-labs/kube-agents#3129). This job's
        # timeout is 840m, so a heartbeat that stops before then means the
        # project is about to be taken away, whatever its exit status says.
        ( "${BOSKOSCTL[@]}" heartbeat --resource "${RESOURCE}" --period=30s --retries=8 --timeout=860m || true
          [ -e "${TEARDOWN_SENTINEL}" ] || kill -TERM $$ ) &
        HEARTBEAT_PID=$!

        # Every step runs in the background and is waited on, because bash
        # defers a trapped signal until the *foreground* command completes.
        # Run in the foreground, a heartbeat failure mid-eval would sit
        # pending for the rest of the multi-hour step -- long past the 5m
        # Boskos reaper window, so a concurrent run could lease the same
        # project -- and if the step then exited 0, cleanup would capture
        # rc=0 and the job would go green having never run the eval. `wait`
        # is interruptible, so the trap fires immediately and cleanup sees
        # 143.
        #
        # Signalling the process group (kill -TERM 0) also interrupts
        # promptly, but prow's entrypoint starts the job without Setpgid
        # (sigs.k8s.io/prow pkg/entrypoint/run.go), so the group includes the
        # entrypoint itself: it would mark the job aborted and SIGKILL this
        # script once grace_period expires, cutting teardown and the Boskos
        # release short. This form does not depend on that topology.
        run_step() { "$@" & STEP_PID=$!; wait "${STEP_PID}"; }

        # Clean up any leftover state if a previous job was hard-killed
        run_step ./hack/ci-teardown.sh || true
        run_step ./hack/ci-connection-test.sh
        run_step ./hack/ci-deploy.sh
        run_step ./hack/ci-eval-pr.sh
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
      volumeMounts:
      - name: gemini-secret
        mountPath: /etc/gemini-secret
        readOnly: true
      - name: eval-model
        mountPath: /etc/eval-model
        readOnly: true
      - name: bench-github-token
        mountPath: /etc/bench-github-token
        readOnly: true
      - name: ledger-app-key
        mountPath: /etc/ledger-app-key
        readOnly: true
    volumes:
    - name: gemini-secret
      secret:
        secretName: kube-agents-gemini-api-key
    - name: eval-model
      secret:
        secretName: kube-agents-eval-model
    - name: bench-github-token
      secret:
        secretName: kube-agents-bench-github-token
    - name: ledger-app-key
      secret:
        secretName: kube-agents-evals-ledger-app-key
# The GitLab lane's nightly (gke-labs/kube-agents#2832): the GitHub nightly's
# shape with EVAL_FORGE=gitlab, two hours after it so the two do not compete
# for pool projects at midnight, one at a time. The script runs the lane's
# list (hack/eval/gitlab-cases.txt), not the catalogue, with no part split,
# and records nothing in the evidence store; EVAL_BASELINE_STORE stays set
# for the read, as on a presubmit, and the recorder's own guard refuses the
# write under this forge.
- name: ci-kube-agents-eval-nightly-main-d
  # The main-d shard of the nightly's main part (gke-labs/kube-agents#4238).
  # On gemini-4-argon the main-a half was cut at its 840m budget on five of
  # seven nights (10-31 to 11-06) while main-b, with as many stack cases, ran
  # 449-749m: main-a also carries the onboarding cases' chain, five cases
  # under one state lock, 380-480m of wall clock on its own. hack/ci-eval-pr.sh
  # now runs the main part as five shards, EVAL_NIGHTLY_PART=main-a to
  # main-e: main-a keeps the onboarding chain and no other stack case, and
  # hack/eval/nightly-main-b.txt to nightly-main-e.txt deal every other
  # stack case across main-b to main-e, so a new stack case leaves hours of
  # headroom under 840m. Otherwise this is the main-b
  # job's spec, copied: the same lease pool, provisioning, deploy, eval,
  # teardown, identity, cron and log bucket, so its baseline records and its
  # logs land where the other parts' do (the dashboard joins the builds into
  # one night). The shards' cases are disjoint, so no case is recorded twice
  # a night. The Boskos owner, log path and build identity all derive from
  # JOB_NAME and BUILD_ID, so nothing below needs to differ by hand. The
  # deploy admits EVAL_MODE_NEXT=1 here by job name (EVAL_MODE_NEXT_JOB_NAMES
  # in hack/ci-deploy.sh), so until the gke-labs/kube-agents change that adds
  # this name merges this job reds at the deploy's refusal, a minute after
  # its lease. That is the expected state for the night between the two
  # merges: this change lands first, because the kube-agents change gives
  # main-a and main-b their new, narrower meaning the night it lands, and the
  # cases of main-c, main-d and main-e would run nowhere until these jobs exist.
  cluster: build-kube-agents
  # 00:00 UTC (8 PM EDT / 7 PM EST; 5 PM / 4 PM Pacific): after the working
  # day's presubmit herd in the team's Eastern time zone, so the nightly's
  # model-quota draw rarely contends with pull requests, and the night is
  # over before the next morning's 11 AM ET digest reports it. The herd can
  # still hold the pool at this hour (34 smoke runs did on 2026-11-11,
  # gke-labs/kube-agents#5472), so the acquire below waits up to 90m of this
  # part's own timeout for a project.
  # ci-kube-agents-pool-pressure above fires at :23 and leases nothing from
  # Boskos, so the two never contend.
  cron: "0 0 * * *"
  # A slow nightly must skip the next tick, not stack a second lease and a
  # second full provisioning behind it.
  max_concurrency: 1
  decorate: true
  decoration_config:
    # The presubmit's 360m budget, for a bigger matrix. Priced from the
    # NIGHTLY_TASKS comment in hack/ci-eval-pr.sh as of 2026-09-10: the
    # eighteen presubmit tasks are ~211min SERIAL (the twenty-task ~317min
    # of build 2094442155576659968 less the ~106min #1218 moved out), and
    # the eight nightly-only entries add ~321-341min (five recast cases
    # ~190min, the two tofu incumbents ~106min, knowledge-grounding
    # ~25-45min): twenty-six tasks, ~532-552min serial at three repetitions.
    # The presubmit's parallel runs on 2026-09-10 realised ~1.15x at
    # EVAL_TASK_PARALLELISM=4 (177-217min whole-job for the ~211min-serial
    # matrix) under the daytime herd's model-quota contention; at that rate
    # the nightly projects to ~470-490min, which 360m would truncate most
    # nights. 480m fits with margin, and this job is non-gating, so a long
    # night costs a lease and nothing else (gke-labs/kube-agents#1491). The
    # nightly also runs at EVAL_TASK_PARALLELISM=8 (exported below): it is
    # alone on the quota at this hour. Measured over the first six nights
    # (2026-09-16..21, gke-labs/kube-agents#1491): the matrix grew to 41
    # cases / 123 units and spent 1734-2693 serial minutes a night; at
    # parallelism 6 the fan-out realised 5.4-5.8x, so three of six nights ran
    # to this deadline and recorded nothing. At 8 the worst night so far fits
    # in ~6h; the budget stays 480m. Back to 6 under spec.mode next (see the
    # export below).
    # 720m -> 840m for the gemini-4-argon window (oss-test-infra#2758): the first
    # Argon night (2026-10-29) cut main-a at 720m with 252 of 255 units done,
    # ~750m needed, and main-b took 550m. A run cut at 840m ends by 14:06 UTC;
    # the ci-health digest moves to 11 AM Toronto to stay after that, and the
    # dashboard's running window to 14h30m (gke-labs/kube-agents#4238).
    # Before that, 480m -> 720m with the move to Claude (gke-labs/kube-agents#3384): the
    # whole main part on claude-opus-5 at parallelism 8 replays to a median
    # of 426min and a maximum of 528min over the nine Claude nights
    # 10-08..16. Split into two halves on two leased projects (option C
    # there), the same replay puts each half at a ~219min median and a
    # ~305min maximum. Each half keeps 720m all the same: that replay is
    # today-mode at parallelism 8, and the first spec.mode next night (build
    # 2113782591592075264, the whole main part at parallelism 6, 23min of it
    # the next-mode deploy) ran to 720m with about 20 cases finished. A run
    # cut at 720m still ends by 12:00 UTC, before the 15:00 UTC digest (11 AM Toronto; gke-labs/kube-agents#4238).
    timeout: 840m
    grace_period: 5m
    # Logs and artifacts go to a bucket kube-agents owns, NOT the cluster
    # default gs://kube-agents-prow (prow/oss/config.yaml, build-kube-agents).
    # This job runs as eval-baseline-recorder (see serviceAccountName below),
    # and that identity has no write on kube-agents-prow, which the oss-prow
    # team owns: night one died in initupload with a 403 on
    # storage.objects.create before the test container ever started (build
    # 2099649477534027776). Rather than ask for a grant on a bucket that is
    # not ours, the nightly uploads to one that is. Granted on it: this job's
    # identity and crier (oss-prow@oss-prow) as objectAdmin; Deck
    # (oss-prow-public-deck@oss-prow) and the ci-health collector
    # (github-actions@kube-agents-prow) as objectViewer. Only the bucket is
    # overridden: path_strategy and Workload Identity credentials come from
    # the cluster default, which Prow merges under a job-level override field
    # by field.
    gcs_configuration:
      bucket: kube-agents-evals-nightly-logs
  annotations:
    # No TestGrid tab on purpose: the team reads this run through the eval
    # dashboard (gke-labs/kube-agents#1335) rather than a second UI, so the
    # googleoss-kube-agents dashboard keeps only the pool-pressure tab.
    testgrid-create-test-group: "false"
    description: Nightly kube-agents eval on main under spec.mode next, the main-d shard of the main part (the stack-bearing cases hack/eval/nightly-main-d.txt lists), on its own project (gke-labs/kube-agents#4238).
  extra_refs:
  - org: gke-labs
    repo: kube-agents
    base_ref: main
    workdir: true
  spec:
    # NOT prowjob-default-sa, which the presubmit runs as. The read/write
    # split on the evidence bucket -- this job appends, a pull request only
    # reads -- is expressible only across two identities, because one account
    # cannot both hold and be denied objectCreator (docs/designs/eval-scorer.md,
    # "Two conditions that guard depends on", in gke-labs/kube-agents). The KSA
    # test-pods/eval-baseline-recorder and its Workload Identity binding to
    # eval-baseline-recorder@kube-agents-prow.iam.gserviceaccount.com are
    # prerequisites of this file: without them this pod does not schedule.
    serviceAccountName: eval-baseline-recorder
    containers:
    - image: gcr.io/k8s-staging-test-infra/kubekins-e2e:latest-1.32
      command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # procps for pkill: cleanup() uses it to reap the heartbeat's
        # boskosctl child, and its `|| true` would swallow a missing binary.
        apt-get update && apt-get install -y --no-install-recommends gettext-base jq procps
        command -v gke-gcloud-auth-plugin >/dev/null
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh && chmod +x install-opentofu.sh && ./install-opentofu.sh --install-method standalone
        export GEMINI_API_KEY="$(cat /etc/gemini-secret/GEMINI_API_KEY)"
        # The bench verifier reads back the GitHub ledger issue the run
        # published and grades its contents; ledger_issue_contains has no
        # other credential source, and the *-infra repos are private.
        export BENCH_GITHUB_TOKEN="$(cat /etc/bench-github-token/BENCH_GITHUB_TOKEN)"
        # hack/ci-eval-pr.sh mints a 1-hour installation token per
        # devops-bench invocation and overwrites BENCH_GITHUB_TOKEN with it.
        # App 4739812 is read-only and scoped to the *-infra repos.
        # gke-labs/kube-agents#994.
        export EVAL_LEDGER_APP_KEY_FILE="/etc/ledger-app-key/key.pem"
        # Turns on the in-cluster token minter, which is what lets the agent
        # write that issue. An App ID is an identifier, not a credential:
        # minting requires signing a JWT with the App's private key, which
        # is non-exportable inside each pool project's Cloud KMS. What bounds
        # where a run can write is the App's installation list -- the
        # *-infra repos, repository_selection: selected -- not this value,
        # which gke-labs/kube-agents already publishes.
        export EVAL_GITHUB_APP_ID="4675512"
        export REQUIRE_CACHE="true"
        # The tier switch: hack/ci-eval-pr.sh appends its NIGHTLY_TASKS array
        # to the presubmit matrix on this value and refuses anything it does
        # not recognise. This export is the whole difference between this job
        # and the presubmit's eval step.
        export EVAL_TIER="nightly"
        # ─── spec.mode next ─────────────────────────────────────────────────
        # As ci-kube-agents-eval-nightly above: hack/ci-deploy.sh flips the
        # install to spec.mode next after the today-mode install has passed
        # its own gates, and hack/ci-eval-pr.sh runs this shard through the
        # gateway's inject door, less hack/eval/inject-lane-exclusions.txt.
        # The deploy admits the flag on this job, which has no PULL_NUMBER,
        # only by name (EVAL_MODE_NEXT_JOB_NAMES in hack/ci-deploy.sh, which
        # the gke-labs/kube-agents change that teaches hack/ci-eval-pr.sh the
        # main-d part also extends; until it merges this job reds at the
        # deploy's refusal, as the header says). bench-gate reads the inject transport
        # as the version key's next mode, so the lines this job appends file
        # under next and never reach today's window.
        export EVAL_MODE_NEXT="1"
        # ─── The agent model: the `nightly` pair of the eval-model Secret ─────────
        # The nightlies' pair, which every nightly and weekly periodic reads;
        # the gate's record is built from these runs, so `gate.name` must name
        # the same model or rung 6 compares nothing.
        # Mounted at /etc/eval-model from kube-agents-eval-model (namespace
        # test-pods on build-kube-agents). The mechanism and its reasons are on
        # pull-kube-agents-smoke-test's block in kube-agents-presubmits.yaml;
        # this block sets no model, and a switch is one write to the Secret.
        MODEL_PROVIDER="$(tr -d '[:space:]' < /etc/eval-model/nightly.provider)"
        MODEL_DEFAULT_NAME="$(tr -d '[:space:]' < /etc/eval-model/nightly.name)"
        : "${MODEL_PROVIDER:?eval-model Secret: nightly.provider is missing or empty}"
        : "${MODEL_DEFAULT_NAME:?eval-model Secret: nightly.name is missing or empty}"
        export MODEL_PROVIDER MODEL_DEFAULT_NAME
        export AGENT_MODEL_OVERRIDE="${MODEL_DEFAULT_NAME}"
        # The main part: everything but the cases that request a pull
        # request, which ci-kube-agents-eval-nightly-writers and its -b and -c
        # thirds below run on leased projects of their own
        # (gke-labs/kube-agents#2467, #4238). Those run one
        # unit at a time after every other unit, against the project's one
        # GitOps repository, and on one project that phase and the infra
        # lock's stretch did not fit 480m together. The main part itself is
        # split in five disjoint shards (gke-labs/kube-agents#3384, option C,
        # then #4238; the split lives in hack/ci-eval-pr.sh): this job runs
        # main-d, the stack-bearing cases hack/eval/nightly-main-d.txt lists;
        # ci-kube-agents-eval-nightly runs main-a and -main-b, -main-c, -main-e run the
        # other shards.
        export EVAL_NIGHTLY_PART="main-d"
        # 6 under spec.mode next, as ci-kube-agents-eval-nightly (its
        # comment says why).
        export EVAL_TASK_PARALLELISM="6"
        # ─── Baseline evidence store: ARMED ──────────────────────────────────
        # The bucket, the eval-baseline-recorder identity this job runs as,
        # and the grants on both are prerequisites -- docs/designs/
        # eval-scorer.md, "Provisioning it", in gke-labs/kube-agents. The
        # contract from hack/ci-eval-pr.sh's EVAL_BASELINE_STORE comment:
        # turning the store on is TWO Prow exports, not one. This nightly
        # holds objectViewer AND objectCreator on the bucket (it appends one
        # immutable object per case per night); the presubmit exports the
        # SAME variable with objectViewer only (it reads). Forgetting the
        # presubmit half is silent -- it keeps reading the empty checked-in
        # directory and reports a legitimate green with the rate-based rungs
        # inert. baseline-append.jsonl still rides as an artifact.
        #
        # EVAL_REPETITIONS stays at the script's default 3: at that count a
        # case reaches the 20-run admission bar after seven nights, and the
        # matrix already projects past this job's 360m at three (see the
        # timeout comment above). Raise it here on measured wall clock from
        # the first nights, not on arithmetic.
        export EVAL_BASELINE_STORE="gs://kube-agents-evals-bench/evidence"
        # ─── Ensure boskosctl is available (pinned version) ─────────────────────────
        # Named once, used by both the GCS fast path and the fallback below.
        BOSKOSCTL_VERSION="v0.0.0-20260730151943-11fb0c84248b"
        if ! command -v boskosctl >/dev/null; then
          # Prefer a binary staged in a bucket we own. gke-labs/kube-agents#943
          # died here: proxy.golang.org answered INTERNAL_ERROR and the job
          # exited before it had leased a project, so no task ran at all and
          # there was nothing for a rerun to repeat. A pinned binary does not
          # need the public module proxy on the critical path of every run.
          #
          # NOTE: gs://kube-agents-prow/tools/boskosctl-* does not exist yet.
          # Until somebody stages it, this copy always misses and the fallback
          # is the real path -- which is why the fallback is retried.
          if gsutil -q cp "gs://kube-agents-prow/tools/boskosctl-${BOSKOSCTL_VERSION}" /usr/local/bin/boskosctl; then
            chmod +x /usr/local/bin/boskosctl
            echo "✓ boskosctl ${BOSKOSCTL_VERSION} restored from GCS"
          else
            echo "boskosctl ${BOSKOSCTL_VERSION} not in GCS; falling back to the module proxy"
            for attempt in 1 2 3; do
              if GOBIN=/usr/local/bin go install "sigs.k8s.io/boskos/cmd/boskosctl@${BOSKOSCTL_VERSION}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "ERROR: go install boskosctl failed 3 times; proxy.golang.org is the usual cause"
                exit 1
              fi
              echo "go install attempt ${attempt} failed; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            done
          fi
        fi

        # ─── Boskos Lease, Heartbeat & Cleanup Handler ──────────────────────────────
        BOSKOS_SERVER="http://boskos.boskos.svc.cluster.local"
        BOSKOS_RESOURCE_TYPE="kube-agents-evals-project"
        BOSKOS_OWNER="${JOB_NAME}-${BUILD_ID}"
        BOSKOSCTL=(boskosctl --server-url="${BOSKOS_SERVER}" --owner-name="${BOSKOS_OWNER}")

        echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Leasing GCP Project from Boskos ==="
        # 90m, not the presubmit's 10m: the eight nightly parts lease together at
        # 00:00 UTC against a pool the presubmit herd may have filled, and the
        # wait comes out of this part's own timeout (gke-labs/kube-agents#5472).
        RESOURCE="$("${BOSKOSCTL[@]}" acquire --type="${BOSKOS_RESOURCE_TYPE}" \
          --state=free --target-state=busy --timeout=90m)"
        LEASED_PROJECT="$(echo "${RESOURCE}" | jq -r .name)"
        if [ -z "${LEASED_PROJECT}" ] || [ "${LEASED_PROJECT}" = "null" ]; then
          echo "ERROR: could not parse leased project from: ${RESOURCE}"
          exit 1
        fi
        export PROJECT_ID="${LEASED_PROJECT}"
        echo "✓ Successfully leased project: ${PROJECT_ID}"

        # Marks "teardown has begun" for the heartbeat's abort fallback. Its
        # directory is created fresh by mktemp -d, so the sentinel provably
        # does not exist until cleanup() creates it -- a fixed path could be
        # left behind by an earlier run and would silence the abort for the
        # whole job.
        TEARDOWN_DIR="$(mktemp -d)"
        TEARDOWN_SENTINEL="${TEARDOWN_DIR}/teardown-begun"

        cleanup() {
          local rc=$?
          trap - EXIT INT TERM
          # Before the kills, and this ordering is the point. If the
          # heartbeat exhausts its retries in the window between `trap -`
          # above and the subshell actually dying, its `kill -TERM $$`
          # fallback lands with no handler installed and terminates this
          # script mid-teardown -- before ci-teardown.sh finishes and before
          # the Boskos release, leaking GKE resources into a project the next
          # lease hands straight to somebody else. The sentinel silences the
          # fallback for an expiry during intentional teardown only; a
          # heartbeat that dies mid-eval still aborts the run.
          touch "${TEARDOWN_SENTINEL}"
          # boskosctl is a child of the subshell, not the subshell itself:
          # the subshell body is a compound command, so bash does not
          # exec-optimise it away. Killing only ${HEARTBEAT_PID} orphans a
          # heartbeat that keeps beating a resource this cleanup is about to
          # release, and Boskos answers 401 Unauthorized on the owner
          # mismatch -- nine of them, matching --retries=8. That reads like a
          # credential problem next to a Boskos release and is not one.
          pkill -P "${HEARTBEAT_PID:-0}" 2>/dev/null || true
          kill "${HEARTBEAT_PID:-}" 2>/dev/null || true
          kill "${STEP_PID:-}" 2>/dev/null || true
          echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Running CI Teardown ==="
          ./hack/ci-teardown.sh || true
          if [ -n "${LEASED_PROJECT:-}" ] && [ "${LEASED_PROJECT}" != "null" ]; then
            echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Releasing Boskos Project: ${LEASED_PROJECT} ==="
            "${BOSKOSCTL[@]}" release --name="${LEASED_PROJECT}" --target-state=free || true
          fi
          exit $rc
        }
        trap cleanup EXIT INT TERM

        # The abort fallback fires only while the eval is still running. Once
        # cleanup() has touched the sentinel the resource is on its way back
        # to the pool, so an expiring heartbeat is expected and must not
        # signal a script that is mid-teardown. `$$` is still this script's
        # PID inside the subshell, which is what the comment below is about.
        #
        # --timeout outlives the job, and ANY exit of the heartbeat aborts the
        # run, exit 0 included. boskosctl stops beating at its --timeout (5h by
        # default) and exits 0; four kube-agents smoke runs held past that point
        # on 2026-10-14 lost their leases while still running, the reaper handed
        # their projects to other runs, and at the ceiling their teardowns
        # uninstalled the new tenants (gke-labs/kube-agents#3129). This job's
        # timeout is 840m, so a heartbeat that stops before then means the
        # project is about to be taken away, whatever its exit status says.
        ( "${BOSKOSCTL[@]}" heartbeat --resource "${RESOURCE}" --period=30s --retries=8 --timeout=860m || true
          [ -e "${TEARDOWN_SENTINEL}" ] || kill -TERM $$ ) &
        HEARTBEAT_PID=$!

        # Every step runs in the background and is waited on, because bash
        # defers a trapped signal until the *foreground* command completes.
        # Run in the foreground, a heartbeat failure mid-eval would sit
        # pending for the rest of the multi-hour step -- long past the 5m
        # Boskos reaper window, so a concurrent run could lease the same
        # project -- and if the step then exited 0, cleanup would capture
        # rc=0 and the job would go green having never run the eval. `wait`
        # is interruptible, so the trap fires immediately and cleanup sees
        # 143.
        #
        # Signalling the process group (kill -TERM 0) also interrupts
        # promptly, but prow's entrypoint starts the job without Setpgid
        # (sigs.k8s.io/prow pkg/entrypoint/run.go), so the group includes the
        # entrypoint itself: it would mark the job aborted and SIGKILL this
        # script once grace_period expires, cutting teardown and the Boskos
        # release short. This form does not depend on that topology.
        run_step() { "$@" & STEP_PID=$!; wait "${STEP_PID}"; }

        # Clean up any leftover state if a previous job was hard-killed
        run_step ./hack/ci-teardown.sh || true
        run_step ./hack/ci-connection-test.sh
        run_step ./hack/ci-deploy.sh
        run_step ./hack/ci-eval-pr.sh
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
      volumeMounts:
      - name: gemini-secret
        mountPath: /etc/gemini-secret
        readOnly: true
      - name: eval-model
        mountPath: /etc/eval-model
        readOnly: true
      - name: bench-github-token
        mountPath: /etc/bench-github-token
        readOnly: true
      - name: ledger-app-key
        mountPath: /etc/ledger-app-key
        readOnly: true
    volumes:
    - name: gemini-secret
      secret:
        secretName: kube-agents-gemini-api-key
    - name: eval-model
      secret:
        secretName: kube-agents-eval-model
    - name: bench-github-token
      secret:
        secretName: kube-agents-bench-github-token
    - name: ledger-app-key
      secret:
        secretName: kube-agents-evals-ledger-app-key
# The GitLab lane's nightly (gke-labs/kube-agents#2832): the GitHub nightly's
# shape with EVAL_FORGE=gitlab, two hours after it so the two do not compete
# for pool projects at midnight, one at a time. The script runs the lane's
# list (hack/eval/gitlab-cases.txt), not the catalogue, with no part split,
# and records nothing in the evidence store; EVAL_BASELINE_STORE stays set
# for the read, as on a presubmit, and the recorder's own guard refuses the
# write under this forge.
- name: ci-kube-agents-eval-nightly-main-e
  # The main-e shard of the nightly's main part (gke-labs/kube-agents#4238).
  # On gemini-4-argon the main-a half was cut at its 840m budget on five of
  # seven nights (10-31 to 11-06) while main-b, with as many stack cases, ran
  # 449-749m: main-a also carries the onboarding cases' chain, five cases
  # under one state lock, 380-480m of wall clock on its own. hack/ci-eval-pr.sh
  # now runs the main part as five shards, EVAL_NIGHTLY_PART=main-a to
  # main-e: main-a keeps the onboarding chain and no other stack case, and
  # hack/eval/nightly-main-b.txt to nightly-main-e.txt deal every other
  # stack case across main-b to main-e, so a new stack case leaves hours of
  # headroom under 840m. Otherwise this is the main-b
  # job's spec, copied: the same lease pool, provisioning, deploy, eval,
  # teardown, identity, cron and log bucket, so its baseline records and its
  # logs land where the other parts' do (the dashboard joins the builds into
  # one night). The shards' cases are disjoint, so no case is recorded twice
  # a night. The Boskos owner, log path and build identity all derive from
  # JOB_NAME and BUILD_ID, so nothing below needs to differ by hand. The
  # deploy admits EVAL_MODE_NEXT=1 here by job name (EVAL_MODE_NEXT_JOB_NAMES
  # in hack/ci-deploy.sh), so until the gke-labs/kube-agents change that adds
  # this name merges this job reds at the deploy's refusal, a minute after
  # its lease. That is the expected state for the night between the two
  # merges: this change lands first, because the kube-agents change gives
  # main-a and main-b their new, narrower meaning the night it lands, and the
  # cases of main-c, main-d and main-e would run nowhere until these jobs exist.
  cluster: build-kube-agents
  # 00:00 UTC (8 PM EDT / 7 PM EST; 5 PM / 4 PM Pacific): after the working
  # day's presubmit herd in the team's Eastern time zone, so the nightly's
  # model-quota draw rarely contends with pull requests, and the night is
  # over before the next morning's 11 AM ET digest reports it. The herd can
  # still hold the pool at this hour (34 smoke runs did on 2026-11-11,
  # gke-labs/kube-agents#5472), so the acquire below waits up to 90m of this
  # part's own timeout for a project.
  # ci-kube-agents-pool-pressure above fires at :23 and leases nothing from
  # Boskos, so the two never contend.
  cron: "0 0 * * *"
  # A slow nightly must skip the next tick, not stack a second lease and a
  # second full provisioning behind it.
  max_concurrency: 1
  decorate: true
  decoration_config:
    # The presubmit's 360m budget, for a bigger matrix. Priced from the
    # NIGHTLY_TASKS comment in hack/ci-eval-pr.sh as of 2026-09-10: the
    # eighteen presubmit tasks are ~211min SERIAL (the twenty-task ~317min
    # of build 2094442155576659968 less the ~106min #1218 moved out), and
    # the eight nightly-only entries add ~321-341min (five recast cases
    # ~190min, the two tofu incumbents ~106min, knowledge-grounding
    # ~25-45min): twenty-six tasks, ~532-552min serial at three repetitions.
    # The presubmit's parallel runs on 2026-09-10 realised ~1.15x at
    # EVAL_TASK_PARALLELISM=4 (177-217min whole-job for the ~211min-serial
    # matrix) under the daytime herd's model-quota contention; at that rate
    # the nightly projects to ~470-490min, which 360m would truncate most
    # nights. 480m fits with margin, and this job is non-gating, so a long
    # night costs a lease and nothing else (gke-labs/kube-agents#1491). The
    # nightly also runs at EVAL_TASK_PARALLELISM=8 (exported below): it is
    # alone on the quota at this hour. Measured over the first six nights
    # (2026-09-16..21, gke-labs/kube-agents#1491): the matrix grew to 41
    # cases / 123 units and spent 1734-2693 serial minutes a night; at
    # parallelism 6 the fan-out realised 5.4-5.8x, so three of six nights ran
    # to this deadline and recorded nothing. At 8 the worst night so far fits
    # in ~6h; the budget stays 480m. Back to 6 under spec.mode next (see the
    # export below).
    # 720m -> 840m for the gemini-4-argon window (oss-test-infra#2758): the first
    # Argon night (2026-10-29) cut main-a at 720m with 252 of 255 units done,
    # ~750m needed, and main-b took 550m. A run cut at 840m ends by 14:06 UTC;
    # the ci-health digest moves to 11 AM Toronto to stay after that, and the
    # dashboard's running window to 14h30m (gke-labs/kube-agents#4238).
    # Before that, 480m -> 720m with the move to Claude (gke-labs/kube-agents#3384): the
    # whole main part on claude-opus-5 at parallelism 8 replays to a median
    # of 426min and a maximum of 528min over the nine Claude nights
    # 10-08..16. Split into two halves on two leased projects (option C
    # there), the same replay puts each half at a ~219min median and a
    # ~305min maximum. Each half keeps 720m all the same: that replay is
    # today-mode at parallelism 8, and the first spec.mode next night (build
    # 2113782591592075264, the whole main part at parallelism 6, 23min of it
    # the next-mode deploy) ran to 720m with about 20 cases finished. A run
    # cut at 720m still ends by 12:00 UTC, before the 15:00 UTC digest (11 AM Toronto; gke-labs/kube-agents#4238).
    timeout: 840m
    grace_period: 5m
    # Logs and artifacts go to a bucket kube-agents owns, NOT the cluster
    # default gs://kube-agents-prow (prow/oss/config.yaml, build-kube-agents).
    # This job runs as eval-baseline-recorder (see serviceAccountName below),
    # and that identity has no write on kube-agents-prow, which the oss-prow
    # team owns: night one died in initupload with a 403 on
    # storage.objects.create before the test container ever started (build
    # 2099649477534027776). Rather than ask for a grant on a bucket that is
    # not ours, the nightly uploads to one that is. Granted on it: this job's
    # identity and crier (oss-prow@oss-prow) as objectAdmin; Deck
    # (oss-prow-public-deck@oss-prow) and the ci-health collector
    # (github-actions@kube-agents-prow) as objectViewer. Only the bucket is
    # overridden: path_strategy and Workload Identity credentials come from
    # the cluster default, which Prow merges under a job-level override field
    # by field.
    gcs_configuration:
      bucket: kube-agents-evals-nightly-logs
  annotations:
    # No TestGrid tab on purpose: the team reads this run through the eval
    # dashboard (gke-labs/kube-agents#1335) rather than a second UI, so the
    # googleoss-kube-agents dashboard keeps only the pool-pressure tab.
    testgrid-create-test-group: "false"
    description: Nightly kube-agents eval on main under spec.mode next, the main-e shard of the main part (the stack-bearing cases hack/eval/nightly-main-e.txt lists), on its own project (gke-labs/kube-agents#4238).
  extra_refs:
  - org: gke-labs
    repo: kube-agents
    base_ref: main
    workdir: true
  spec:
    # NOT prowjob-default-sa, which the presubmit runs as. The read/write
    # split on the evidence bucket -- this job appends, a pull request only
    # reads -- is expressible only across two identities, because one account
    # cannot both hold and be denied objectCreator (docs/designs/eval-scorer.md,
    # "Two conditions that guard depends on", in gke-labs/kube-agents). The KSA
    # test-pods/eval-baseline-recorder and its Workload Identity binding to
    # eval-baseline-recorder@kube-agents-prow.iam.gserviceaccount.com are
    # prerequisites of this file: without them this pod does not schedule.
    serviceAccountName: eval-baseline-recorder
    containers:
    - image: gcr.io/k8s-staging-test-infra/kubekins-e2e:latest-1.32
      command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # procps for pkill: cleanup() uses it to reap the heartbeat's
        # boskosctl child, and its `|| true` would swallow a missing binary.
        apt-get update && apt-get install -y --no-install-recommends gettext-base jq procps
        command -v gke-gcloud-auth-plugin >/dev/null
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh && chmod +x install-opentofu.sh && ./install-opentofu.sh --install-method standalone
        export GEMINI_API_KEY="$(cat /etc/gemini-secret/GEMINI_API_KEY)"
        # The bench verifier reads back the GitHub ledger issue the run
        # published and grades its contents; ledger_issue_contains has no
        # other credential source, and the *-infra repos are private.
        export BENCH_GITHUB_TOKEN="$(cat /etc/bench-github-token/BENCH_GITHUB_TOKEN)"
        # hack/ci-eval-pr.sh mints a 1-hour installation token per
        # devops-bench invocation and overwrites BENCH_GITHUB_TOKEN with it.
        # App 4739812 is read-only and scoped to the *-infra repos.
        # gke-labs/kube-agents#994.
        export EVAL_LEDGER_APP_KEY_FILE="/etc/ledger-app-key/key.pem"
        # Turns on the in-cluster token minter, which is what lets the agent
        # write that issue. An App ID is an identifier, not a credential:
        # minting requires signing a JWT with the App's private key, which
        # is non-exportable inside each pool project's Cloud KMS. What bounds
        # where a run can write is the App's installation list -- the
        # *-infra repos, repository_selection: selected -- not this value,
        # which gke-labs/kube-agents already publishes.
        export EVAL_GITHUB_APP_ID="4675512"
        export REQUIRE_CACHE="true"
        # The tier switch: hack/ci-eval-pr.sh appends its NIGHTLY_TASKS array
        # to the presubmit matrix on this value and refuses anything it does
        # not recognise. This export is the whole difference between this job
        # and the presubmit's eval step.
        export EVAL_TIER="nightly"
        # ─── spec.mode next ─────────────────────────────────────────────────
        # As ci-kube-agents-eval-nightly above: hack/ci-deploy.sh flips the
        # install to spec.mode next after the today-mode install has passed
        # its own gates, and hack/ci-eval-pr.sh runs this shard through the
        # gateway's inject door, less hack/eval/inject-lane-exclusions.txt.
        # The deploy admits the flag on this job, which has no PULL_NUMBER,
        # only by name (EVAL_MODE_NEXT_JOB_NAMES in hack/ci-deploy.sh, which
        # the gke-labs/kube-agents change that teaches hack/ci-eval-pr.sh the
        # main-e part also extends; until it merges this job reds at the
        # deploy's refusal, as the header says). bench-gate reads the inject transport
        # as the version key's next mode, so the lines this job appends file
        # under next and never reach today's window.
        export EVAL_MODE_NEXT="1"
        # ─── The agent model: the `nightly` pair of the eval-model Secret ─────────
        # The nightlies' pair, which every nightly and weekly periodic reads;
        # the gate's record is built from these runs, so `gate.name` must name
        # the same model or rung 6 compares nothing.
        # Mounted at /etc/eval-model from kube-agents-eval-model (namespace
        # test-pods on build-kube-agents). The mechanism and its reasons are on
        # pull-kube-agents-smoke-test's block in kube-agents-presubmits.yaml;
        # this block sets no model, and a switch is one write to the Secret.
        MODEL_PROVIDER="$(tr -d '[:space:]' < /etc/eval-model/nightly.provider)"
        MODEL_DEFAULT_NAME="$(tr -d '[:space:]' < /etc/eval-model/nightly.name)"
        : "${MODEL_PROVIDER:?eval-model Secret: nightly.provider is missing or empty}"
        : "${MODEL_DEFAULT_NAME:?eval-model Secret: nightly.name is missing or empty}"
        export MODEL_PROVIDER MODEL_DEFAULT_NAME
        export AGENT_MODEL_OVERRIDE="${MODEL_DEFAULT_NAME}"
        # The main part: everything but the cases that request a pull
        # request, which ci-kube-agents-eval-nightly-writers and its -b and -c
        # thirds below run on leased projects of their own
        # (gke-labs/kube-agents#2467, #4238). Those run one
        # unit at a time after every other unit, against the project's one
        # GitOps repository, and on one project that phase and the infra
        # lock's stretch did not fit 480m together. The main part itself is
        # split in five disjoint shards (gke-labs/kube-agents#3384, option C,
        # then #4238; the split lives in hack/ci-eval-pr.sh): this job runs
        # main-e, the stack-bearing cases hack/eval/nightly-main-e.txt lists;
        # ci-kube-agents-eval-nightly runs main-a and -main-b, -main-c, -main-d run the
        # other shards.
        export EVAL_NIGHTLY_PART="main-e"
        # 6 under spec.mode next, as ci-kube-agents-eval-nightly (its
        # comment says why).
        export EVAL_TASK_PARALLELISM="6"
        # ─── Baseline evidence store: ARMED ──────────────────────────────────
        # The bucket, the eval-baseline-recorder identity this job runs as,
        # and the grants on both are prerequisites -- docs/designs/
        # eval-scorer.md, "Provisioning it", in gke-labs/kube-agents. The
        # contract from hack/ci-eval-pr.sh's EVAL_BASELINE_STORE comment:
        # turning the store on is TWO Prow exports, not one. This nightly
        # holds objectViewer AND objectCreator on the bucket (it appends one
        # immutable object per case per night); the presubmit exports the
        # SAME variable with objectViewer only (it reads). Forgetting the
        # presubmit half is silent -- it keeps reading the empty checked-in
        # directory and reports a legitimate green with the rate-based rungs
        # inert. baseline-append.jsonl still rides as an artifact.
        #
        # EVAL_REPETITIONS stays at the script's default 3: at that count a
        # case reaches the 20-run admission bar after seven nights, and the
        # matrix already projects past this job's 360m at three (see the
        # timeout comment above). Raise it here on measured wall clock from
        # the first nights, not on arithmetic.
        export EVAL_BASELINE_STORE="gs://kube-agents-evals-bench/evidence"
        # ─── Ensure boskosctl is available (pinned version) ─────────────────────────
        # Named once, used by both the GCS fast path and the fallback below.
        BOSKOSCTL_VERSION="v0.0.0-20260730151943-11fb0c84248b"
        if ! command -v boskosctl >/dev/null; then
          # Prefer a binary staged in a bucket we own. gke-labs/kube-agents#943
          # died here: proxy.golang.org answered INTERNAL_ERROR and the job
          # exited before it had leased a project, so no task ran at all and
          # there was nothing for a rerun to repeat. A pinned binary does not
          # need the public module proxy on the critical path of every run.
          #
          # NOTE: gs://kube-agents-prow/tools/boskosctl-* does not exist yet.
          # Until somebody stages it, this copy always misses and the fallback
          # is the real path -- which is why the fallback is retried.
          if gsutil -q cp "gs://kube-agents-prow/tools/boskosctl-${BOSKOSCTL_VERSION}" /usr/local/bin/boskosctl; then
            chmod +x /usr/local/bin/boskosctl
            echo "✓ boskosctl ${BOSKOSCTL_VERSION} restored from GCS"
          else
            echo "boskosctl ${BOSKOSCTL_VERSION} not in GCS; falling back to the module proxy"
            for attempt in 1 2 3; do
              if GOBIN=/usr/local/bin go install "sigs.k8s.io/boskos/cmd/boskosctl@${BOSKOSCTL_VERSION}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "ERROR: go install boskosctl failed 3 times; proxy.golang.org is the usual cause"
                exit 1
              fi
              echo "go install attempt ${attempt} failed; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            done
          fi
        fi

        # ─── Boskos Lease, Heartbeat & Cleanup Handler ──────────────────────────────
        BOSKOS_SERVER="http://boskos.boskos.svc.cluster.local"
        BOSKOS_RESOURCE_TYPE="kube-agents-evals-project"
        BOSKOS_OWNER="${JOB_NAME}-${BUILD_ID}"
        BOSKOSCTL=(boskosctl --server-url="${BOSKOS_SERVER}" --owner-name="${BOSKOS_OWNER}")

        echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Leasing GCP Project from Boskos ==="
        # 90m, not the presubmit's 10m: the eight nightly parts lease together at
        # 00:00 UTC against a pool the presubmit herd may have filled, and the
        # wait comes out of this part's own timeout (gke-labs/kube-agents#5472).
        RESOURCE="$("${BOSKOSCTL[@]}" acquire --type="${BOSKOS_RESOURCE_TYPE}" \
          --state=free --target-state=busy --timeout=90m)"
        LEASED_PROJECT="$(echo "${RESOURCE}" | jq -r .name)"
        if [ -z "${LEASED_PROJECT}" ] || [ "${LEASED_PROJECT}" = "null" ]; then
          echo "ERROR: could not parse leased project from: ${RESOURCE}"
          exit 1
        fi
        export PROJECT_ID="${LEASED_PROJECT}"
        echo "✓ Successfully leased project: ${PROJECT_ID}"

        # Marks "teardown has begun" for the heartbeat's abort fallback. Its
        # directory is created fresh by mktemp -d, so the sentinel provably
        # does not exist until cleanup() creates it -- a fixed path could be
        # left behind by an earlier run and would silence the abort for the
        # whole job.
        TEARDOWN_DIR="$(mktemp -d)"
        TEARDOWN_SENTINEL="${TEARDOWN_DIR}/teardown-begun"

        cleanup() {
          local rc=$?
          trap - EXIT INT TERM
          # Before the kills, and this ordering is the point. If the
          # heartbeat exhausts its retries in the window between `trap -`
          # above and the subshell actually dying, its `kill -TERM $$`
          # fallback lands with no handler installed and terminates this
          # script mid-teardown -- before ci-teardown.sh finishes and before
          # the Boskos release, leaking GKE resources into a project the next
          # lease hands straight to somebody else. The sentinel silences the
          # fallback for an expiry during intentional teardown only; a
          # heartbeat that dies mid-eval still aborts the run.
          touch "${TEARDOWN_SENTINEL}"
          # boskosctl is a child of the subshell, not the subshell itself:
          # the subshell body is a compound command, so bash does not
          # exec-optimise it away. Killing only ${HEARTBEAT_PID} orphans a
          # heartbeat that keeps beating a resource this cleanup is about to
          # release, and Boskos answers 401 Unauthorized on the owner
          # mismatch -- nine of them, matching --retries=8. That reads like a
          # credential problem next to a Boskos release and is not one.
          pkill -P "${HEARTBEAT_PID:-0}" 2>/dev/null || true
          kill "${HEARTBEAT_PID:-}" 2>/dev/null || true
          kill "${STEP_PID:-}" 2>/dev/null || true
          echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Running CI Teardown ==="
          ./hack/ci-teardown.sh || true
          if [ -n "${LEASED_PROJECT:-}" ] && [ "${LEASED_PROJECT}" != "null" ]; then
            echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Releasing Boskos Project: ${LEASED_PROJECT} ==="
            "${BOSKOSCTL[@]}" release --name="${LEASED_PROJECT}" --target-state=free || true
          fi
          exit $rc
        }
        trap cleanup EXIT INT TERM

        # The abort fallback fires only while the eval is still running. Once
        # cleanup() has touched the sentinel the resource is on its way back
        # to the pool, so an expiring heartbeat is expected and must not
        # signal a script that is mid-teardown. `$$` is still this script's
        # PID inside the subshell, which is what the comment below is about.
        #
        # --timeout outlives the job, and ANY exit of the heartbeat aborts the
        # run, exit 0 included. boskosctl stops beating at its --timeout (5h by
        # default) and exits 0; four kube-agents smoke runs held past that point
        # on 2026-10-14 lost their leases while still running, the reaper handed
        # their projects to other runs, and at the ceiling their teardowns
        # uninstalled the new tenants (gke-labs/kube-agents#3129). This job's
        # timeout is 840m, so a heartbeat that stops before then means the
        # project is about to be taken away, whatever its exit status says.
        ( "${BOSKOSCTL[@]}" heartbeat --resource "${RESOURCE}" --period=30s --retries=8 --timeout=860m || true
          [ -e "${TEARDOWN_SENTINEL}" ] || kill -TERM $$ ) &
        HEARTBEAT_PID=$!

        # Every step runs in the background and is waited on, because bash
        # defers a trapped signal until the *foreground* command completes.
        # Run in the foreground, a heartbeat failure mid-eval would sit
        # pending for the rest of the multi-hour step -- long past the 5m
        # Boskos reaper window, so a concurrent run could lease the same
        # project -- and if the step then exited 0, cleanup would capture
        # rc=0 and the job would go green having never run the eval. `wait`
        # is interruptible, so the trap fires immediately and cleanup sees
        # 143.
        #
        # Signalling the process group (kill -TERM 0) also interrupts
        # promptly, but prow's entrypoint starts the job without Setpgid
        # (sigs.k8s.io/prow pkg/entrypoint/run.go), so the group includes the
        # entrypoint itself: it would mark the job aborted and SIGKILL this
        # script once grace_period expires, cutting teardown and the Boskos
        # release short. This form does not depend on that topology.
        run_step() { "$@" & STEP_PID=$!; wait "${STEP_PID}"; }

        # Clean up any leftover state if a previous job was hard-killed
        run_step ./hack/ci-teardown.sh || true
        run_step ./hack/ci-connection-test.sh
        run_step ./hack/ci-deploy.sh
        run_step ./hack/ci-eval-pr.sh
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
      volumeMounts:
      - name: gemini-secret
        mountPath: /etc/gemini-secret
        readOnly: true
      - name: eval-model
        mountPath: /etc/eval-model
        readOnly: true
      - name: bench-github-token
        mountPath: /etc/bench-github-token
        readOnly: true
      - name: ledger-app-key
        mountPath: /etc/ledger-app-key
        readOnly: true
    volumes:
    - name: gemini-secret
      secret:
        secretName: kube-agents-gemini-api-key
    - name: eval-model
      secret:
        secretName: kube-agents-eval-model
    - name: bench-github-token
      secret:
        secretName: kube-agents-bench-github-token
    - name: ledger-app-key
      secret:
        secretName: kube-agents-evals-ledger-app-key
- name: ci-kube-agents-eval-nightly-writers
  # The nightly's second part (gke-labs/kube-agents#2467): the cases that
  # request a pull request, the stopped asks and the writes_alone cases, on a
  # project of their own. hack/ci-eval-pr.sh runs them one unit at a time,
  # after every other unit and each after a reset of the project's GitOps
  # repository, so on one project they waited behind the whole of
  # ci-kube-agents-eval-nightly's matrix and ran into its deadline. For the
  # gemini-4-argon window (gke-labs/kube-agents#4238) the part itself runs as
  # three thirds on three projects: on that model a repetition takes 3 to 40
  # minutes (median 17 on the slow night of 2026-10-31, 7 on 11-01), the part
  # grew to fourteen cases (42 serial units) in the first week of November,
  # and the one job was cut at 360m on 10-31 and 11-04. EVAL_NIGHTLY_PART=writers-a
  # below selects this job's third; ci-kube-agents-eval-nightly-writers-b and
  # -writers-c below run the other two (hack/eval/nightly-writers-b.txt and
  # nightly-writers-c.txt place them), and the main job above and
  # ci-kube-agents-eval-nightly-main-b to -main-e run the rest with
  # EVAL_NIGHTLY_PART=main-a to main-e. This change lands before the
  # gke-labs/kube-agents change that teaches hack/ci-eval-pr.sh the new
  # parts, so for the night between the two merges this job reds at the part
  # check's refusal of writers-a (one lost writers night) and the two below
  # at the deploy's; the other order would leave the cases of main-c to
  # main-e unrun until these jobs exist. Otherwise this is
  # that job's spec, copied: the same lease from the kube-agents-evals-project
  # pool, provisioning, deploy, eval, teardown, identity and log bucket, so
  # its baseline records and its logs land where the main part's do (the
  # dashboard joins the builds into one night). Like the main part it
  # grades spec.mode next (EVAL_MODE_NEXT=1 below).
  cluster: build-kube-agents
  # 00:00 UTC (8 PM EDT / 7 PM EST; 5 PM / 4 PM Pacific): after the working
  # day's presubmit herd in the team's Eastern time zone, so the nightly's
  # model-quota draw rarely contends with pull requests, and the night is
  # over before the next morning's 11 AM ET digest reports it. The herd can
  # still hold the pool at this hour (34 smoke runs did on 2026-11-11,
  # gke-labs/kube-agents#5472), so the acquire below waits up to 90m of this
  # part's own timeout for a project.
  # ci-kube-agents-pool-pressure above fires at :23 and leases nothing from
  # Boskos, so the two never contend.
  cron: "0 0 * * *"
  # A slow nightly must skip the next tick, not stack a second lease and a
  # second full provisioning behind it.
  max_concurrency: 1
  decorate: true
  decoration_config:
    # One unit at a time, about 1.5-2h a night for the five such cases at
    # three repetitions as of 2026-10-06; 240m left room for that set to
    # grow. 240m -> 360m for the gemini-4-argon window (oss-test-infra#2758):
    # nine cases then, ~9.4 min a unit on Argon against ~5.5 on Claude, and the
    # first Argon night was cut at 240m with 22 of 27 units launched (~295m
    # needed); the third night, at ~18 min a unit, was cut at 360m with 18 of
    # 27 done, and by 11-06 the part had fourteen cases (42 units) and ran
    # 304-365m even at ~7 min a unit. Since the part runs as three thirds this
    # job carries four or five cases (as of 2026-11-06; a new writer lands in
    # writers-a until a list moves it), twelve to fifteen serial units: about
    # 1.5-2 h at a fast night's pace and about 4 h at the slow night's, so
    # 360m holds with margin and is kept rather than raised. A run cut at 360m
    # still ends by 06:00 UTC, before the digest.
    timeout: 360m
    grace_period: 5m
    # Logs and artifacts go to a bucket kube-agents owns, NOT the cluster
    # default gs://kube-agents-prow (prow/oss/config.yaml, build-kube-agents).
    # This job runs as eval-baseline-recorder (see serviceAccountName below),
    # and that identity has no write on kube-agents-prow, which the oss-prow
    # team owns: night one died in initupload with a 403 on
    # storage.objects.create before the test container ever started (build
    # 2099649477534027776). Rather than ask for a grant on a bucket that is
    # not ours, the nightly uploads to one that is. Granted on it: this job's
    # identity and crier (oss-prow@oss-prow) as objectAdmin; Deck
    # (oss-prow-public-deck@oss-prow) and the ci-health collector
    # (github-actions@kube-agents-prow) as objectViewer. Only the bucket is
    # overridden: path_strategy and Workload Identity credentials come from
    # the cluster default, which Prow merges under a job-level override field
    # by field.
    gcs_configuration:
      bucket: kube-agents-evals-nightly-logs
  annotations:
    # No TestGrid tab on purpose: the team reads this run through the eval
    # dashboard (gke-labs/kube-agents#1335) rather than a second UI, so the
    # googleoss-kube-agents dashboard keeps only the pool-pressure tab.
    testgrid-create-test-group: "false"
    description: Nightly kube-agents eval on main, the first third of the cases that request a pull request, on their own project (gke-labs/kube-agents#2467 and gke-labs/kube-agents#4238).
