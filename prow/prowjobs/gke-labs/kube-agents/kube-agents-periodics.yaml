        run_step ./hack/ci-teardown.sh || true
        run_step ./hack/ci-connection-test.sh
        # The forge VM first: hack/ci-forge.sh up writes the CA the deploy and the eval refuse to run without; `down` in cleanup above deletes it.
        run_step ./hack/ci-forge.sh up
        run_step ./hack/ci-deploy.sh
        run_step ./hack/ci-eval-pr.sh
