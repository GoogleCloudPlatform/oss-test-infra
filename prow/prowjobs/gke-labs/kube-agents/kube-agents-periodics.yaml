        requests:
          memory: "1Gi"
          cpu: "500m"
      volumeMounts:
      - name: gemini-secret
        mountPath: /etc/gemini-secret
        readOnly: true
      - name: eval-model
        mountPath: /etc/eval-model
        readOnly: true
      - name: bench-github-token
        mountPath: /etc/bench-github-token
        readOnly: true
      - name: ledger-app-key
        mountPath: /etc/ledger-app-key
        readOnly: true
