- name: ci-kube-agents-eval-replay-lane
  # The inference-replay lane (gke-labs/kube-agents,
  # examples/inference-replay/eval-design.md, Rollout step 2). The trusted
  # nightlies above run their LiteLLM proxy in record mode and publish the
  # answers of passing runs to gs://kube-agents-replay-cache; this job replays
  # them on the commit the newest recording night ran (main when no record
  # names one), through a proxy in replay mode, to measure how much of a run
  # replay serves and whether each replayed conversation gets the verdict of
  # the night it came from. It gates nothing: hack/ci-eval-pr.sh runs
  # hack/eval/replay-lane-cases.txt under EVAL_REPLAY_LANE=true, with no tier,
  # no evidence store and no dashboard publish, and the collector uploads the
  # lane's report under replay-shadow/replay-lane/ in
  # gs://kube-agents-replay-shadow. Otherwise it copies
  # ci-kube-agents-eval-nightly: the same Boskos lease, provisioning, deploy,
  # spec.mode next and model pair, so its requests are the ones the nightlies
  # recorded. hack/ci-env.sh refuses the lane on any run with a pull-request
  # ref.
  cluster: build-kube-agents
  # 06:00 UTC (1 AM EST): off-peak for the presubmit herd, so the lane's one
  # lease does not compete with pull requests. The nightlies start at 00:00
  # and publish every few minutes while they run, so the lane replays the
  # previous nights' complete recordings plus tonight's partial ones.
  cron: "0 6 * * *"
  # A slow run must skip the next tick, not stack a second lease and a
  # second full provisioning behind it.
  max_concurrency: 1
  decorate: true
  decoration_config:
    # Eight cases at the script's three repetitions, on a fresh install: about
    # the presubmit's shape, whose next-mode runs fit 360m, and most model
    # calls are served from the cache. 300m leaves the lease free before the
    # working day's presubmits.
    timeout: 300m
    grace_period: 5m
    # Logs and artifacts go to a bucket kube-agents owns, NOT the cluster
    # default gs://kube-agents-prow (prow/oss/config.yaml, build-kube-agents).
    # This job runs as eval-baseline-recorder (see serviceAccountName below),
    # and that identity has no write on kube-agents-prow, which the oss-prow
    # team owns: night one died in initupload with a 403 on
    # storage.objects.create before the test container ever started (build
    # 2099649477534027776). Rather than ask for a grant on a bucket that is
    # not ours, the nightly uploads to one that is. Granted on it: this job's
    # identity and crier (oss-prow@oss-prow) as objectAdmin; Deck
    # (oss-prow-public-deck@oss-prow) and the ci-health collector
    # (github-actions@kube-agents-prow) as objectViewer. Only the bucket is
    # overridden: path_strategy and Workload Identity credentials come from
    # the cluster default, which Prow merges under a job-level override field
    # by field.
    gcs_configuration:
      bucket: kube-agents-evals-nightly-logs
  annotations:
    # No TestGrid tab: the lane publishes no eval-dashboard data, and its
    # results are read in two places instead. kube-agents' ci-health watches
    # the job like the certification slice (scripts/eval_dashboard/periodics.py
    # WATCHED, from this bucket's logs/ prefix), so a failed or stale run is a
    # health-bot note and a line in the daily digest (gke-labs/kube-agents#5374);
    # its runbook is docs/ci-pool-projects.md, "The replay lane". The served share and each
    # replayed conversation's verdict are in the report under
    # replay-shadow/replay-lane/<day>/<build>/report/ in
    # gs://kube-agents-replay-shadow, read by the eval crew.
    testgrid-create-test-group: "false"
    description: Non-blocking inference-replay lane, replaying the next-mode nightlies' recorded model answers on the commit the newest night ran; reports served share and verdict agreement, gates nothing.
  extra_refs:
  - org: gke-labs
    repo: kube-agents
    base_ref: main
    workdir: true
  spec:
    # The lane reads gs://kube-agents-replay-cache and writes its report under
    # replay-shadow/replay-lane/; both grants are this identity's alone, so no
    # presubmit can plant answers or reports. The rest is the nightly's:
    # NOT prowjob-default-sa, which the presubmit runs as. The read/write
    # split on the evidence bucket -- this job appends, a pull request only
    # reads -- is expressible only across two identities, because one account
    # cannot both hold and be denied objectCreator (docs/designs/eval-scorer.md,
    # "Two conditions that guard depends on", in gke-labs/kube-agents). The KSA
    # test-pods/eval-baseline-recorder and its Workload Identity binding to
    # eval-baseline-recorder@kube-agents-prow.iam.gserviceaccount.com are
    # prerequisites of this file: without them this pod does not schedule.
    serviceAccountName: eval-baseline-recorder
    containers:
    - image: gcr.io/k8s-staging-test-infra/kubekins-e2e:latest-1.32
      command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # procps for pkill: cleanup() uses it to reap the heartbeat's
        # boskosctl child, and its `|| true` would swallow a missing binary.
        apt-get update && apt-get install -y --no-install-recommends gettext-base jq procps
        command -v gke-gcloud-auth-plugin >/dev/null
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh && chmod +x install-opentofu.sh && ./install-opentofu.sh --install-method standalone
        export GEMINI_API_KEY="$(cat /etc/gemini-secret/GEMINI_API_KEY)"
        # The bench verifier reads back the GitHub ledger issue the run
        # published and grades its contents; ledger_issue_contains has no
        # other credential source, and the *-infra repos are private.
        export BENCH_GITHUB_TOKEN="$(cat /etc/bench-github-token/BENCH_GITHUB_TOKEN)"
        # hack/ci-eval-pr.sh mints a 1-hour installation token per
        # devops-bench invocation and overwrites BENCH_GITHUB_TOKEN with it.
        # App 4739812 is read-only and scoped to the *-infra repos.
        # gke-labs/kube-agents#994.
        export EVAL_LEDGER_APP_KEY_FILE="/etc/ledger-app-key/key.pem"
        # Turns on the in-cluster token minter, which is what lets the agent
        # write that issue. An App ID is an identifier, not a credential:
        # minting requires signing a JWT with the App's private key, which
        # is non-exportable inside each pool project's Cloud KMS. What bounds
        # where a run can write is the App's installation list -- the
        # *-infra repos, repository_selection: selected -- not this value,
        # which gke-labs/kube-agents already publishes.
        export EVAL_GITHUB_APP_ID="4675512"
        export REQUIRE_CACHE="true"
        # ─── The replay lane ─────────────────────────────────────────────────
        # Replaces the tier: hack/ci-eval-pr.sh takes hack/eval/replay-lane-cases.txt
        # and refuses the lane with EVAL_TIER or EVAL_FORGE set. No
        # EVAL_NIGHTLY_PART or EVAL_BASELINE_STORE either: the lane records
        # nothing as main's history.
        export EVAL_REPLAY_LANE="true"
        # ─── spec.mode next ─────────────────────────────────────────────────
        # hack/ci-deploy.sh flips the install to spec.mode next after the
        # today-mode install has passed its own gates, and hack/ci-eval-pr.sh
        # runs the matrix through the gateway's inject door, less
        # hack/eval/inject-lane-exclusions.txt. The deploy admits the flag on
        # this job, which has no PULL_NUMBER, only by name
        # (EVAL_MODE_NEXT_JOB_NAMES in hack/ci-deploy.sh, which
        # gke-labs/kube-agents#5089 extends with this job's name: merge that
        # first, or this job reds at the deploy's refusal). bench-gate reads the inject transport
        # as the version key's next mode, so the lines this job appends file
        # under next and never reach today's window.
        export EVAL_MODE_NEXT="1"
        # ─── The agent model: the `nightly` pair of the eval-model Secret ─────────
        # The nightlies' pair, not the gate's: the replay key carries the
        # LiteLLM config, so the lane serves only what a nightly on the same
        # model recorded.
        # Mounted at /etc/eval-model from kube-agents-eval-model (namespace
        # test-pods on build-kube-agents). The mechanism and its reasons are on
        # pull-kube-agents-smoke-test's block in kube-agents-presubmits.yaml;
        # this block sets no model, and a switch is one write to the Secret.
        MODEL_PROVIDER="$(tr -d '[:space:]' < /etc/eval-model/nightly.provider)"
        MODEL_DEFAULT_NAME="$(tr -d '[:space:]' < /etc/eval-model/nightly.name)"
        : "${MODEL_PROVIDER:?eval-model Secret: nightly.provider is missing or empty}"
        : "${MODEL_DEFAULT_NAME:?eval-model Secret: nightly.name is missing or empty}"
        export MODEL_PROVIDER MODEL_DEFAULT_NAME
        export AGENT_MODEL_OVERRIDE="${MODEL_DEFAULT_NAME}"
        # The presubmit's fan-out: the lane is eight cases.
        export EVAL_TASK_PARALLELISM="4"
        # ─── Ensure boskosctl is available (pinned version) ─────────────────────────
        # Named once, used by both the GCS fast path and the fallback below.
        BOSKOSCTL_VERSION="v0.0.0-20260730151943-11fb0c84248b"
        if ! command -v boskosctl >/dev/null; then
          # Prefer a binary staged in a bucket we own. gke-labs/kube-agents#943
          # died here: proxy.golang.org answered INTERNAL_ERROR and the job
          # exited before it had leased a project, so no task ran at all and
          # there was nothing for a rerun to repeat. A pinned binary does not
          # need the public module proxy on the critical path of every run.
          #
          # NOTE: gs://kube-agents-prow/tools/boskosctl-* does not exist yet.
          # Until somebody stages it, this copy always misses and the fallback
          # is the real path -- which is why the fallback is retried.
          if gsutil -q cp "gs://kube-agents-prow/tools/boskosctl-${BOSKOSCTL_VERSION}" /usr/local/bin/boskosctl; then
            chmod +x /usr/local/bin/boskosctl
            echo "✓ boskosctl ${BOSKOSCTL_VERSION} restored from GCS"
          else
            echo "boskosctl ${BOSKOSCTL_VERSION} not in GCS; falling back to the module proxy"
            for attempt in 1 2 3; do
              if GOBIN=/usr/local/bin go install "sigs.k8s.io/boskos/cmd/boskosctl@${BOSKOSCTL_VERSION}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "ERROR: go install boskosctl failed 3 times; proxy.golang.org is the usual cause"
                exit 1
              fi
              echo "go install attempt ${attempt} failed; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            done
          fi
        fi

        # ─── Replay on the commit the newest recording night ran ──────────────────
        # The nightlies check out main at 00:00 and record; main at 06:00 can
        # differ, and a prompt or normalizer change merged in between makes
        # the lane's requests match no recording, so the lane would measure
        # how far main moved overnight instead of replay
        # (gke-labs/kube-agents#5666). Each publish record names the commit
        # its night ran, and fetch_cache.py --print-commit prints the newest
        # night's, read here from main's checkout with the bucket, age, mode
        # and forge hack/ci-env.sh's prepare_replay_lane_cache fetches with
        # (EVAL_REPLAY_CACHE_BUCKET, unset here, defaults to the bucket below,
        # hack/ci-env.sh's REPLAY_CACHE_DEFAULT_BUCKET; the age is
        # fetch_cache.py's own default, which REPLAY_LANE_CACHE_MAX_AGE_HOURS
        # equals). It is stdlib Python plus
        # gcloud, so it runs before anything is built, and everything after
        # it (teardown, deploy, images, scripts) comes from that commit.
        # Before the lease, so a slow fetch holds no project. It prints
        # nothing when no record names a commit, and the job stays on main;
        # so does a value that is not a full SHA, a commit not on main's
        # history, or one that cannot be fetched. None of those fails the
        # job: the lane then replays on main, as it did before records named
        # a commit. hack/ci-env.sh hands REPLAY_LANE_COMMIT_SOURCE and the
        # checkout's commit to the lane's report. One consequence: a change to
        # the lane's own scripts (or a kube-agents change this job comes to
        # need) reaches the lane a night later, once a nightly has recorded on
        # it.
        REPLAY_LANE_CACHE_BUCKET="${EVAL_REPLAY_CACHE_BUCKET:-kube-agents-replay-cache}"
        REPLAY_LANE_REPO_URL="https://github.com/gke-labs/kube-agents.git"
        REPLAY_LANE_COMMIT_RE='^[0-9a-f]{40}$'
        REPLAY_LANE_FETCH_ATTEMPTS=3
        REPLAY_LANE_FETCH_BACKOFF_SECONDS=10
        export REPLAY_LANE_COMMIT_SOURCE="main"
        main_commit="$(git rev-parse HEAD)"
        recorded_commit="$(python3 hack/replay-proxy/fetch_cache.py --print-commit \
          --bucket "${REPLAY_LANE_CACHE_BUCKET}" \
          --eval-mode-next "${EVAL_MODE_NEXT:-}" --forge "${EVAL_FORGE:-}" < /dev/null)" || recorded_commit=""
        if ! [[ "${recorded_commit}" =~ ${REPLAY_LANE_COMMIT_RE} ]]; then
          echo "Replay lane: no recording night names a commit (the line above says why); replaying on main, ${main_commit}"
        else
          have_commit="false"
          if git cat-file -e "${recorded_commit}^{commit}" 2>/dev/null; then
            have_commit="true"
          else
            for attempt in $(seq 1 "${REPLAY_LANE_FETCH_ATTEMPTS}"); do
              if git fetch --quiet "${REPLAY_LANE_REPO_URL}" "${recorded_commit}"; then
                have_commit="true"
                break
              fi
              if [ "${attempt}" -lt "${REPLAY_LANE_FETCH_ATTEMPTS}" ]; then
                echo "git fetch of ${recorded_commit} failed (attempt ${attempt}); retrying in $((attempt * REPLAY_LANE_FETCH_BACKOFF_SECONDS))s"
                sleep "$((attempt * REPLAY_LANE_FETCH_BACKOFF_SECONDS))"
              fi
            done
          fi
          if [ "${have_commit}" != "true" ]; then
            echo "Replay lane: could not fetch ${recorded_commit}, the commit the newest recording night ran, after ${REPLAY_LANE_FETCH_ATTEMPTS} attempts; replaying on main, ${main_commit}"
          elif ! git merge-base --is-ancestor "${recorded_commit}" "${main_commit}"; then
            echo "Replay lane: ${recorded_commit}, which the newest recording night names, is not on main's history; replaying on main, ${main_commit}"
          elif ! git checkout --quiet --detach "${recorded_commit}"; then
            echo "Replay lane: could not check out ${recorded_commit}; replaying on main, ${main_commit}"
            git checkout --quiet --detach "${main_commit}"
          else
            REPLAY_LANE_COMMIT_SOURCE="recording"
            echo "Replay lane: replaying on ${recorded_commit}, the commit the newest recording night ran (main is ${main_commit})"
          fi
        fi

        # ─── Boskos Lease, Heartbeat & Cleanup Handler ──────────────────────────────
        BOSKOS_SERVER="http://boskos.boskos.svc.cluster.local"
        BOSKOS_RESOURCE_TYPE="kube-agents-evals-project"
        BOSKOS_OWNER="${JOB_NAME}-${BUILD_ID}"
        BOSKOSCTL=(boskosctl --server-url="${BOSKOS_SERVER}" --owner-name="${BOSKOS_OWNER}")

        echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Leasing GCP Project from Boskos ==="
        RESOURCE="$("${BOSKOSCTL[@]}" acquire --type="${BOSKOS_RESOURCE_TYPE}" \
          --state=free --target-state=busy --timeout=10m)"
        LEASED_PROJECT="$(echo "${RESOURCE}" | jq -r .name)"
        if [ -z "${LEASED_PROJECT}" ] || [ "${LEASED_PROJECT}" = "null" ]; then
          echo "ERROR: could not parse leased project from: ${RESOURCE}"
          exit 1
        fi
        export PROJECT_ID="${LEASED_PROJECT}"
        echo "✓ Successfully leased project: ${PROJECT_ID}"

        # Marks "teardown has begun" for the heartbeat's abort fallback. Its
        # directory is created fresh by mktemp -d, so the sentinel provably
        # does not exist until cleanup() creates it -- a fixed path could be
        # left behind by an earlier run and would silence the abort for the
        # whole job.
        TEARDOWN_DIR="$(mktemp -d)"
        TEARDOWN_SENTINEL="${TEARDOWN_DIR}/teardown-begun"

        cleanup() {
          local rc=$?
          trap - EXIT INT TERM
          # Before the kills, and this ordering is the point. If the
          # heartbeat exhausts its retries in the window between `trap -`
          # above and the subshell actually dying, its `kill -TERM $$`
          # fallback lands with no handler installed and terminates this
          # script mid-teardown -- before ci-teardown.sh finishes and before
          # the Boskos release, leaking GKE resources into a project the next
          # lease hands straight to somebody else. The sentinel silences the
          # fallback for an expiry during intentional teardown only; a
          # heartbeat that dies mid-eval still aborts the run.
          touch "${TEARDOWN_SENTINEL}"
          # boskosctl is a child of the subshell, not the subshell itself:
          # the subshell body is a compound command, so bash does not
          # exec-optimise it away. Killing only ${HEARTBEAT_PID} orphans a
          # heartbeat that keeps beating a resource this cleanup is about to
          # release, and Boskos answers 401 Unauthorized on the owner
          # mismatch -- nine of them, matching --retries=8. That reads like a
          # credential problem next to a Boskos release and is not one.
          pkill -P "${HEARTBEAT_PID:-0}" 2>/dev/null || true
          kill "${HEARTBEAT_PID:-}" 2>/dev/null || true
          kill "${STEP_PID:-}" 2>/dev/null || true
          echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Running CI Teardown ==="
          ./hack/ci-teardown.sh || true
          if [ -n "${LEASED_PROJECT:-}" ] && [ "${LEASED_PROJECT}" != "null" ]; then
            echo "=== [$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Releasing Boskos Project: ${LEASED_PROJECT} ==="
            "${BOSKOSCTL[@]}" release --name="${LEASED_PROJECT}" --target-state=free || true
          fi
          exit $rc
        }
        trap cleanup EXIT INT TERM

        # The abort fallback fires only while the eval is still running. Once
        # cleanup() has touched the sentinel the resource is on its way back
        # to the pool, so an expiring heartbeat is expected and must not
        # signal a script that is mid-teardown. `$$` is still this script's
        # PID inside the subshell, which is what the comment below is about.
        #
        # --timeout outlives the job, and ANY exit of the heartbeat aborts the
        # run, exit 0 included. boskosctl stops beating at its --timeout (5h by
        # default) and exits 0; four kube-agents smoke runs held past that point
        # on 2026-10-14 lost their leases while still running, the reaper handed
        # their projects to other runs, and at the ceiling their teardowns
        # uninstalled the new tenants (gke-labs/kube-agents#3129). This job's
        # timeout is 300m, so a heartbeat that stops before then means the
        # project is about to be taken away, whatever its exit status says.
        ( "${BOSKOSCTL[@]}" heartbeat --resource "${RESOURCE}" --period=30s --retries=8 --timeout=320m || true
          [ -e "${TEARDOWN_SENTINEL}" ] || kill -TERM $$ ) &
        HEARTBEAT_PID=$!

        # Every step runs in the background and is waited on, because bash
        # defers a trapped signal until the *foreground* command completes.
        # Run in the foreground, a heartbeat failure mid-eval would sit
        # pending for the rest of the multi-hour step -- long past the 5m
        # Boskos reaper window, so a concurrent run could lease the same
        # project -- and if the step then exited 0, cleanup would capture
        # rc=0 and the job would go green having never run the eval. `wait`
        # is interruptible, so the trap fires immediately and cleanup sees
        # 143.
        #
        # Signalling the process group (kill -TERM 0) also interrupts
        # promptly, but prow's entrypoint starts the job without Setpgid
        # (sigs.k8s.io/prow pkg/entrypoint/run.go), so the group includes the
        # entrypoint itself: it would mark the job aborted and SIGKILL this
        # script once grace_period expires, cutting teardown and the Boskos
        # release short. This form does not depend on that topology.
        run_step() { "$@" & STEP_PID=$!; wait "${STEP_PID}"; }

        # Clean up any leftover state if a previous job was hard-killed
        run_step ./hack/ci-teardown.sh || true
        run_step ./hack/ci-connection-test.sh
        run_step ./hack/ci-deploy.sh
        run_step ./hack/ci-eval-pr.sh
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
      volumeMounts:
      - name: gemini-secret
        mountPath: /etc/gemini-secret
        readOnly: true
      - name: eval-model
        mountPath: /etc/eval-model
        readOnly: true
      - name: bench-github-token
        mountPath: /etc/bench-github-token
        readOnly: true
      - name: ledger-app-key
        mountPath: /etc/ledger-app-key
        readOnly: true
    volumes:
    - name: gemini-secret
      secret:
        secretName: kube-agents-gemini-api-key
    - name: eval-model
      secret:
        secretName: kube-agents-eval-model
    - name: bench-github-token
      secret:
        secretName: kube-agents-bench-github-token
    - name: ledger-app-key
      secret:
        secretName: kube-agents-evals-ledger-app-key
