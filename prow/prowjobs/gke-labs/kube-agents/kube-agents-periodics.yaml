- name: ci-kube-agents-eval-nightly-today
  # The today-mode nightly, kept as the rollback check once the main nightly
  # moved to spec.mode next (gke-labs/kube-agents#2007): the full eval catalog
  # on main on a fresh spec.mode today install, over the agent API, with the
  # agent on Claude like every eval job here. It is the one run that records
  # today's window in the evidence store, which is what a rollback to today
  # is measured against; ci-kube-agents-eval-today proves the rollback itself
  # every six hours and records nothing. This job was
  # ci-kube-agents-eval-nightly-next-claude, the next-mode twin of the
  # nightly, until the nightly took that role: renamed, with EVAL_MODE_NEXT
  # dropped and the recorder identity and log bucket the nightly uses. The
  # deploy refuses EVAL_MODE_NEXT=1 on this name (it is not in
  # EVAL_MODE_NEXT_JOB_NAMES in hack/ci-deploy.sh), so the flag leaking in
  # stops the run at second zero rather than recording next as today.
  cluster: build-kube-agents
  # 06:00 UTC daily: after the main nightly's 00:00 start, before the daytime
  # presubmit herd. Each run leases its own project and Claude has fixed quota
  # per project, so the two nightlies do not contend.
  cron: "0 6 * * *"
