  # provisioning, deploy, eval, teardown, identity, cron and log bucket, so
  # its baseline records and its logs land where the other parts' do (the
  # dashboard joins the builds into one night). The thirds' cases are
  # disjoint, so no case is recorded twice a night. The Boskos owner, log
  # path and build identity all derive from JOB_NAME and BUILD_ID, so nothing
  # below needs to differ by hand. The deploy admits EVAL_MODE_NEXT=1 here by
  # job name (EVAL_MODE_NEXT_JOB_NAMES in hack/ci-deploy.sh), so until the
  # gke-labs/kube-agents change that adds this name merges this job reds at
  # the deploy's refusal, a minute after its lease: the expected state for the
  # night between the two merges, since this change lands first (the main
  # jobs' header says why).
  cluster: build-kube-agents
