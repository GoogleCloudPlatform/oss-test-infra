    # 2026-10-08, 75 cases: today on this pool took 558m (deploy 19m, fan-out
    # 464m, then the pull-request units one at a time 73m). 900m is 61% over
    # that, room for the matrix to grow. A deadline-length run still ends by
    # 21:05 UTC, before the main nightly's 00:00 start.
    timeout: 900m
    grace_period: 5m
